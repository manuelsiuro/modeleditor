<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortress - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Fortress</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Fortress - Stylized Low-Poly 3D Model Snippet

const PALETTE = {
    mainWalls: 0x3A3A3A,
    cornerTowers: 0x5A5A5A,
    banners: 0xC0392B,
    bannerFabric: 0x8B1A1A,
    iron: 0x2A2A2A,
    torchFlame: 0xFF8C00,
    goldTrim: 0xDAA520,
    foundation: 0x6A6A6A,
    wood: 0x5D4037,
    moat: 0x2C3E50
};

// --- FOUNDATION & MOAT ---
addMesh(new THREE.BoxGeometry(20, 0.2, 20), PALETTE.moat, [0, -0.1, 0], [0, 0, 0], "MoatArea");
addMesh(new THREE.BoxGeometry(14, 0.5, 14), PALETTE.foundation, [0, 0.25, 0], [0, 0, 0], "MainFoundation");

// --- CENTRAL KEEP ---
addMesh(new THREE.BoxGeometry(6, 12, 6), PALETTE.mainWalls, [0, 6, 0], [0, 0, 0], "CentralKeep");

// Keep Decorative Bands
addMesh(new THREE.BoxGeometry(6.2, 0.2, 6.2), PALETTE.foundation, [0, 4, 0], [0, 0, 0], "KeepBand_Lower");
addMesh(new THREE.BoxGeometry(6.2, 0.2, 6.2), PALETTE.foundation, [0, 8, 0], [0, 0, 0], "KeepBand_Upper");

// Keep Crenellations (Merlons)
for (let i = -2.5; i <= 2.5; i += 1.25) {
    addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), PALETTE.mainWalls, [i, 12.25, 3], [0, 0, 0], "KeepMerlon_F");
    addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), PALETTE.mainWalls, [i, 12.25, -3], [0, 0, 0], "KeepMerlon_B");
    addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), PALETTE.mainWalls, [3, 12.25, i], [0, 0, 0], "KeepMerlon_R");
    addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), PALETTE.mainWalls, [-3, 12.25, i], [0, 0, 0], "KeepMerlon_L");
}

// Arrow Slits
const slitGeom = new THREE.BoxGeometry(0.1, 0.8, 0.1);
for (let y = 3; y <= 9; y += 3) {
    addMesh(slitGeom, 0x000000, [1, y, 3.01], [0, 0, 0], "KeepSlit_F1");
    addMesh(slitGeom, 0x000000, [-1, y, 3.01], [0, 0, 0], "KeepSlit_F2");
}

// --- CORNER TOWERS ---
const towerPos = [[4.5, 4.5], [-4.5, 4.5], [4.5, -4.5], [-4.5, -4.5]];
towerPos.forEach((pos, index) => {
    const name = `CornerTower_${index}`;
    // Main tower body
    addMesh(new THREE.BoxGeometry(2.5, 14, 2.5), PALETTE.cornerTowers, [pos[0], 7, pos[1]], [0, 0, 0], name);
    
    // Tower crenellations
    for (let i = -1; i <= 1; i += 1) {
        addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), PALETTE.cornerTowers, [pos[0] + i, 14.2, pos[1] + 1.25], [0, 0, 0], `${name}_Merlon`);
        addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), PALETTE.cornerTowers, [pos[0] + i, 14.2, pos[1] - 1.25], [0, 0, 0], `${name}_Merlon`);
        addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), PALETTE.cornerTowers, [pos[0] + 1.25, 14.2, pos[1] + i], [0, 0, 0], `${name}_Merlon`);
        addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), PALETTE.cornerTowers, [pos[0] - 1.25, 14.2, pos[1] + i], [0, 0, 0], `${name}_Merlon`);
    }

    // Pyramid cap
    addMesh(new THREE.ConeGeometry(2, 3, 4), PALETTE.banners, [pos[0], 15.5, pos[1]], [0, Math.PI / 4, 0], `${name}_Cap`);
    
    // Gold trim at cap base
    addMesh(new THREE.BoxGeometry(2.6, 0.1, 2.6), PALETTE.goldTrim, [pos[0], 14, pos[1]], [0, 0, 0], `${name}_GoldTrim`);

    // Flag pole and pennant
    addMesh(new THREE.CylinderGeometry(0.05, 0.05, 2), PALETTE.iron, [pos[0], 17.5, pos[1]], [0, 0, 0], `${name}_Pole`);
    addMesh(new THREE.ConeGeometry(0.3, 0.6, 3), PALETTE.banners, [pos[0] + 0.3, 18.2, pos[1]], [0, 0, Math.PI/2], `${name}_Pennant`);
    
    // Banner hanging from tower
    addMesh(new THREE.BoxGeometry(0.8, 2.5, 0.05), PALETTE.banners, [pos[0], 12, pos[1] + 1.3], [0, 0, 0], `${name}_Banner`);
});

// --- THICK WALLS ---
// Side walls
addMesh(new THREE.BoxGeometry(1.5, 8, 6.5), PALETTE.mainWalls, [4.5, 4, 0], [0, 0, 0], "Wall_Right");
addMesh(new THREE.BoxGeometry(1.5, 8, 6.5), PALETTE.mainWalls, [-4.5, 4, 0], [0, 0, 0], "Wall_Left");
// Back wall
addMesh(new THREE.BoxGeometry(6.5, 8, 1.5), PALETTE.mainWalls, [0, 4, -4.5], [0, 0, 0], "Wall_Back");

// Wall Merlons (Right)
for (let i = -3; i <= 3; i += 1.5) {
    addMesh(new THREE.BoxGeometry(0.4, 0.4, 1.2), PALETTE.mainWalls, [4.5, 8.2, i], [0, 0, 0], "WallMerlon_R");
}

// --- MAIN GATE & FRONT WALL ---
addMesh(new THREE.BoxGeometry(2.5, 8, 1.5), PALETTE.mainWalls, [-2, 4, 4.5], [0, 0, 0], "FrontWall_L");
addMesh(new THREE.BoxGeometry(2.5, 8, 1.5), PALETTE.mainWalls, [2, 4, 4.5], [0, 0, 0], "FrontWall_R");

// Gate opening (Darkness)
addMesh(new THREE.BoxGeometry(1.5, 4, 0.1), 0x000000, [0, 2, 4.45], [0, 0, 0], "GateOpening");

// Portcullis
for (let x = -0.6; x <= 0.6; x += 0.4) {
    addMesh(new THREE.BoxGeometry(0.05, 4, 0.05), PALETTE.iron, [x, 2, 4.5], [0, 0, 0], "Portcullis_V");
}
for (let y = 0.5; y <= 3.5; y += 1) {
    addMesh(new THREE.BoxGeometry(1.5, 0.05, 0.05), PALETTE.iron, [0, y, 4.5], [0, 0, 0], "Portcullis_H");
}

// Gate Frame & Gold Trim
addMesh(new THREE.BoxGeometry(2, 0.4, 1.7), PALETTE.goldTrim, [0, 4, 4.5], [0, 0, 0], "GateTopTrim");
addMesh(new THREE.BoxGeometry(0.5, 0.5, 0.1), PALETTE.goldTrim, [0, 4.8, 4.6], [0, 0, 0], "GateShield");

// Buttresses
addMesh(new THREE.BoxGeometry(0.8, 8, 0.8), PALETTE.foundation, [-1.2, 4, 5], [0, 0, 0], "Buttress_L");
addMesh(new THREE.BoxGeometry(0.8, 8, 0.8), PALETTE.foundation, [1.2, 4, 5], [0, 0, 0], "Buttress_R");

// --- COURTYARD PROPS ---
// Large banner on Keep
addMesh(new THREE.BoxGeometry(1.5, 4, 0.05), PALETTE.banners, [0, 9, 3.1], [0, 0, 0], "KeepBanner_Main");

// Weapon Racks
const rackGeom = new THREE.BoxGeometry(0.1, 1.5, 0.1);
addMesh(rackGeom, PALETTE.wood, [-3, 0.75, 2], [0, 0, 0], "WeaponRack_PostL");
addMesh(rackGeom, PALETTE.wood, [-2, 0.75, 2], [0, 0, 0], "WeaponRack_PostR");
addMesh(new THREE.BoxGeometry(1.2, 0.1, 0.1), PALETTE.wood, [-2.5, 1.2, 2], [0, 0, 0], "WeaponRack_Bar");

// Training Dummy
addMesh(new THREE.BoxGeometry(0.2, 1.8, 0.2), PALETTE.wood, [3, 0.9, 2], [0, 0, 0], "Dummy_Post");
addMesh(new THREE.BoxGeometry(1.2, 0.2, 0.2), PALETTE.wood, [3, 1.5, 2], [0, 0, 0], "Dummy_Arms");

// Supply Crates
addMesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), PALETTE.wood, [-3, 0.4, -2.5], [0, 0.4, 0], "Crate_1");
addMesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), PALETTE.wood, [-3, 1.15, -2.5], [0, -0.2, 0], "Crate_2");
addMesh(new THREE.CylinderGeometry(0.4, 0.4, 1, 8), PALETTE.wood, [-2, 0.5, -2.5], [0, 0, 0], "Barrel");

// Torches
const torchPos = [[-1.3, 4.6], [1.3, 4.6], [-4.6, 0], [4.6, 0]];
torchPos.forEach((p, i) => {
    addMesh(new THREE.BoxGeometry(0.2, 0.2, 0.3), PALETTE.iron, [p[0], 5, p[1]], [0, 0, 0], `Torch_Bracket_${i}`);
    addMesh(new THREE.ConeGeometry(0.15, 0.3, 4), PALETTE.torchFlame, [p[0], 5.3, p[1]], [0, 0, 0], `Torch_Flame_${i}`);
});

// Defensive Barriers
addMesh(new THREE.BoxGeometry(2, 1, 0.5), PALETTE.foundation, [-2, 0.5, 7], [0, -Math.PI/6, 0], "Barrier_L");
addMesh(new THREE.BoxGeometry(2, 1, 0.5), PALETTE.foundation, [2, 0.5, 7], [0, Math.PI/6, 0], "Barrier_R");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
