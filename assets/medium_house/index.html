<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium House - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Medium House</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Medium House - Low Poly 3D Model
// Generated for Gemini CLI blendermcp project

const PALETTE = {
    plaster: 0xE8D8C0,
    timber: 0x5C3A1E,
    roof: 0x4A3520,
    glow: 0xFFD080,
    stone: 0x8A8A7A,
    door: 0xA0724A,
    trim: 0x6B4226,
    flower: 0xFF69B4,
    leaf: 0x2E8B57
};

// --- BASE STRUCTURE ---

// Foundation
addMesh(new THREE.BoxGeometry(3.2, 0.2, 2.2), PALETTE.stone, [0, 0.1, 0], [0, 0, 0], "Foundation");

// Ground Floor (Beige Plaster)
addMesh(new THREE.BoxGeometry(3, 1.5, 2), PALETTE.plaster, [0, 0.95, 0], [0, 0, 0], "GroundFloor");

// Ground Floor Timber Framing (Corners)
const beamWidth = 0.15;
const groundHeight = 1.5;
addMesh(new THREE.BoxGeometry(beamWidth, groundHeight, beamWidth), PALETTE.timber, [1.5, 0.95, 1], [0, 0, 0], "Beam_GF_C1");
addMesh(new THREE.BoxGeometry(beamWidth, groundHeight, beamWidth), PALETTE.timber, [-1.5, 0.95, 1], [0, 0, 0], "Beam_GF_C2");
addMesh(new THREE.BoxGeometry(beamWidth, groundHeight, beamWidth), PALETTE.timber, [1.5, 0.95, -1], [0, 0, 0], "Beam_GF_C3");
addMesh(new THREE.BoxGeometry(beamWidth, groundHeight, beamWidth), PALETTE.timber, [-1.5, 0.95, -1], [0, 0, 0], "Beam_GF_C4");

// Ground Floor Timber Framing (Horizontal)
addMesh(new THREE.BoxGeometry(3.1, beamWidth, beamWidth), PALETTE.timber, [0, 0.25, 1], [0, 0, 0], "Beam_GF_H1");
addMesh(new THREE.BoxGeometry(3.1, beamWidth, beamWidth), PALETTE.timber, [0, 1.7, 1], [0, 0, 0], "Beam_GF_H2");

// Overhanging Second Floor
const overhangWidth = 3.5;
const overhangDepth = 2.4;
const secondFloorHeight = 1.6;
addMesh(new THREE.BoxGeometry(overhangWidth, secondFloorHeight, overhangDepth), PALETTE.plaster, [0, 2.5, 0], [0, 0, 0], "SecondFloor");

// Second Floor Timber Framing (Corners)
addMesh(new THREE.BoxGeometry(beamWidth, secondFloorHeight, beamWidth), PALETTE.timber, [1.75, 2.5, 1.2], [0, 0, 0], "Beam_SF_C1");
addMesh(new THREE.BoxGeometry(beamWidth, secondFloorHeight, beamWidth), PALETTE.timber, [-1.75, 2.5, 1.2], [0, 0, 0], "Beam_SF_C2");
addMesh(new THREE.BoxGeometry(beamWidth, secondFloorHeight, beamWidth), PALETTE.timber, [1.75, 2.5, -1.2], [0, 0, 0], "Beam_SF_C3");
addMesh(new THREE.BoxGeometry(beamWidth, secondFloorHeight, beamWidth), PALETTE.timber, [-1.75, 2.5, -1.2], [0, 0, 0], "Beam_SF_C4");

// Second Floor Timber Framing (Diagonal Bracing)
const diagGeo = new THREE.BoxGeometry(beamWidth, 2.2, beamWidth * 0.5);
addMesh(diagGeo, PALETTE.timber, [1, 2.5, 1.2], [0, 0, Math.PI / 4], "Beam_SF_D1");
addMesh(diagGeo, PALETTE.timber, [-1, 2.5, 1.2], [0, 0, -Math.PI / 4], "Beam_SF_D2");

// Support Brackets
addMesh(new THREE.BoxGeometry(0.2, 0.3, 0.4), PALETTE.timber, [1.2, 1.6, 1], [0, 0, 0], "Bracket1");
addMesh(new THREE.BoxGeometry(0.2, 0.3, 0.4), PALETTE.timber, [-1.2, 1.6, 1], [0, 0, 0], "Bracket2");
addMesh(new THREE.BoxGeometry(0.2, 0.3, 0.4), PALETTE.timber, [0, 1.6, 1], [0, 0, 0], "Bracket3");

// --- ROOF ---

// Steep Pitched Roof
const roofGroup = new THREE.Group();
const roofSideGeo = new THREE.BoxGeometry(overhangWidth + 0.4, 0.1, 2);
const roofAngle = Math.PI / 3; // 60 degrees

const roofL = addMesh(roofSideGeo, PALETTE.roof, [-0.85, 4.1, 0], [0, 0, roofAngle], "Roof_L");
const roofR = addMesh(roofSideGeo, PALETTE.roof, [0.85, 4.1, 0], [0, 0, -roofAngle], "Roof_R");

// Gable Ends (Triangles)
const gableGeo = new THREE.ConeGeometry(1.7, 1.5, 4); // Square base cone
addMesh(gableGeo, PALETTE.plaster, [0, 3.8, 1.15], [0, Math.PI / 4, 0], "Gable_F");
addMesh(gableGeo, PALETTE.plaster, [0, 3.8, -1.15], [0, Math.PI / 4, 0], "Gable_B");

// --- WINDOWS & DOOR ---

// Front Door
addMesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), PALETTE.door, [0, 0.65, 1], [0, 0, 0], "Door");
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), PALETTE.door, [0, 1.1, 1], [Math.PI/2, 0, 0], "DoorTop");
addMesh(new THREE.SphereGeometry(0.04), 0xCCAC00, [0.2, 0.65, 1.05], [0, 0, 0], "Doorknob");
addMesh(new THREE.BoxGeometry(0.8, 0.1, 0.3), PALETTE.stone, [0, 0.05, 1.15], [0, 0, 0], "Step");

// Windows (Ground Floor)
const winGeo = new THREE.BoxGeometry(0.4, 0.4, 0.05);
addMesh(winGeo, PALETTE.glow, [0.9, 1, 1], [0, 0, 0], "Win_GF_L_Glow");
addMesh(new THREE.BoxGeometry(0.45, 0.05, 0.08), PALETTE.timber, [0.9, 1, 1.01], [0, 0, 0], "Win_GF_L_H");
addMesh(new THREE.BoxGeometry(0.05, 0.45, 0.08), PALETTE.timber, [0.9, 1, 1.01], [0, 0, 0], "Win_GF_L_V");

addMesh(winGeo, PALETTE.glow, [-0.9, 1, 1], [0, 0, 0], "Win_GF_R_Glow");
addMesh(new THREE.BoxGeometry(0.45, 0.05, 0.08), PALETTE.timber, [-0.9, 1, 1.01], [0, 0, 0], "Win_GF_R_H");
addMesh(new THREE.BoxGeometry(0.05, 0.45, 0.08), PALETTE.timber, [-0.9, 1, 1.01], [0, 0, 0], "Win_GF_R_V");

// Windows (Second Floor)
addMesh(winGeo, PALETTE.glow, [0.8, 2.5, 1.2], [0, 0, 0], "Win_SF_L_Glow");
addMesh(winGeo, PALETTE.glow, [-0.8, 2.5, 1.2], [0, 0, 0], "Win_SF_R_Glow");
addMesh(winGeo, PALETTE.glow, [0, 2.5, 1.2], [0, 0, 0], "Win_SF_C_Glow");

// --- PROPS ---

// Chimney
addMesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), PALETTE.stone, [1.2, 4, -0.6], [0, 0, 0], "Chimney");
addMesh(new THREE.BoxGeometry(0.6, 0.15, 0.6), PALETTE.stone, [1.2, 5.25, -0.6], [0, 0, 0], "ChimneyCap");

// Shutters
const shutterGeo = new THREE.BoxGeometry(0.2, 0.4, 0.03);
addMesh(shutterGeo, PALETTE.door, [0.65, 1, 1.05], [0, 0, 0], "Shutter_GF_L1");
addMesh(shutterGeo, PALETTE.door, [1.15, 1, 1.05], [0, 0, 0.1], "Shutter_GF_L2");

// Flower Boxes
const boxGeo = new THREE.BoxGeometry(0.5, 0.1, 0.15);
addMesh(boxGeo, PALETTE.door, [0.8, 2.2, 1.3], [0, 0, 0], "FlowerBox_L");
addMesh(new THREE.SphereGeometry(0.05), PALETTE.flower, [0.8, 2.3, 1.3], [0, 0, 0], "Flower1");
addMesh(new THREE.SphereGeometry(0.05), PALETTE.flower, [0.9, 2.3, 1.35], [0, 0, 0], "Flower2");

// Balcony
addMesh(new THREE.BoxGeometry(0.8, 0.1, 0.4), PALETTE.timber, [-0.8, 2.2, 1.4], [0, 0, 0], "BalconyFloor");
addMesh(new THREE.BoxGeometry(0.8, 0.05, 0.05), PALETTE.timber, [-0.8, 2.5, 1.6], [0, 0, 0], "BalconyRail_H");
addMesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), PALETTE.timber, [-1.15, 2.35, 1.6], [0, 0, 0], "BalconyRail_V1");
addMesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), PALETTE.timber, [-0.45, 2.35, 1.6], [0, 0, 0], "BalconyRail_V2");

// Lantern
addMesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), PALETTE.glow, [0.4, 1.2, 1.1], [0, 0, 0], "Lantern_Glow");
addMesh(new THREE.BoxGeometry(0.02, 0.2, 0.1), PALETTE.timber, [0.4, 1.3, 1.05], [0, 0, 0], "Lantern_Bracket");

// Potted Plant
addMesh(new THREE.CylinderGeometry(0.1, 0.07, 0.2), PALETTE.trim, [-0.5, 0.2, 1.3], [0, 0, 0], "Pot");
addMesh(new THREE.IcosahedronGeometry(0.15, 0), PALETTE.leaf, [-0.5, 0.35, 1.3], [0, 0, 0], "Plant");

// Barrel
addMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5, 8), PALETTE.door, [1.8, 0.3, 0], [0, 0, 0], "Barrel");
addMesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 8), PALETTE.trim, [1.8, 0.4, 0], [0, 0, 0], "BarrelRing1");
addMesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 8), PALETTE.trim, [1.8, 0.2, 0], [0, 0, 0], "BarrelRing2");

// Crate
addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), PALETTE.trim, [1.8, 0.25, 0.6], [0, 0.5, 0], "Crate");

// Cobblestone Path
for(let i=0; i<5; i++) {
    addMesh(new THREE.BoxGeometry(0.3, 0.02, 0.3), PALETTE.stone, [(Math.random()-0.5)*0.5, 0.01, 1.5 + i*0.3], [0, Math.random(), 0], "PathStone_"+i);
}

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
