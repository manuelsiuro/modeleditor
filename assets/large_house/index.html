<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large House - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Large House</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        
// Large House - Low Poly Model Snippet
const PALETTE = {
    stoneWalls: 0xD0C8B0,
    darkRoof: 0x3A3520,
    ironGrey: 0x4A4A4A,
    windowGlow: 0xFFD080,
    richBrown: 0x6B4226,
    goldAccent: 0xDAA520,
    stoneGrey: 0x8A8A7A,
    greenIvy: 0x4A8C3F
};

// --- MAIN STRUCTURE ---
// Main Wing
addMesh(new THREE.BoxGeometry(4, 5, 6), PALETTE.stoneWalls, [0, 2.5, 0], [0, 0, 0], "MainWing");
// Side Wing (L-shape)
addMesh(new THREE.BoxGeometry(3.5, 5, 3), PALETTE.stoneWalls, [3.75, 2.5, 1.5], [0, 0, 0], "SideWing");

// String Courses (Horizontal Ledges)
addMesh(new THREE.BoxGeometry(4.2, 0.15, 6.2), PALETTE.stoneGrey, [0, 1.6, 0], [0, 0, 0], "StringCourse1_Main");
addMesh(new THREE.BoxGeometry(4.2, 0.15, 6.2), PALETTE.stoneGrey, [0, 3.2, 0], [0, 0, 0], "StringCourse2_Main");
addMesh(new THREE.BoxGeometry(3.7, 0.15, 3.2), PALETTE.stoneGrey, [3.75, 1.6, 1.5], [0, 0, 0], "StringCourse1_Side");
addMesh(new THREE.BoxGeometry(3.7, 0.15, 3.2), PALETTE.stoneGrey, [3.75, 3.2, 1.5], [0, 0, 0], "StringCourse2_Side");

// --- ROOF ---
// Main Roof (Prism)
const mainRoofGeom = new THREE.ConeGeometry(3.5, 3, 4); // Hacky prism
addMesh(mainRoofGeom, PALETTE.darkRoof, [0, 6.5, 0], [0, Math.PI/4, 0], "MainRoof");
// Custom pitched roof logic using Box rotated 45deg and scaled
function addPitchedRoof(width, length, height, pos, name) {
    const roofPart1 = new THREE.BoxGeometry(width * 0.75, 0.2, length);
    addMesh(roofPart1, PALETTE.darkRoof, [pos[0] - width/4, pos[1], pos[2]], [0, 0, Math.PI/4], name + "_Left");
    addMesh(roofPart1, PALETTE.darkRoof, [pos[0] + width/4, pos[1], pos[2]], [0, 0, -Math.PI/4], name + "_Right");
}

// Actually let's use a cleaner approach for the steep roof
// Main Roof
const roofMain = new THREE.BoxGeometry(4.5, 4.5, 6.5);
addMesh(roofMain, PALETTE.darkRoof, [0, 6.5, 0], [0, 0, Math.PI/4], "MainRoofShape");

// Side Roof
const roofSide = new THREE.BoxGeometry(3.5, 3.5, 4);
addMesh(roofSide, PALETTE.darkRoof, [3.75, 5.8, 1.5], [Math.PI/4, 0, 0], "SideRoofShape");

// --- ENTRANCE ---
// Portico Columns
addMesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5), PALETTE.stoneWalls, [-1, 0.75, 3.1], [0, 0, 0], "ColumnL");
addMesh(new THREE.CylinderGeometry(0.1, 0.1, 1.5), PALETTE.stoneWalls, [1, 0.75, 3.1], [0, 0, 0], "ColumnR");
// Pediment
addMesh(new THREE.ConeGeometry(1.2, 0.6, 4), PALETTE.stoneGrey, [0, 1.8, 3.1], [0, Math.PI/4, 0], "Pediment");
// Main Door
addMesh(new THREE.BoxGeometry(1.2, 1.8, 0.1), PALETTE.richBrown, [0, 0.9, 3], [0, 0, 0], "MainDoor");
// Door Knocker
addMesh(new THREE.TorusGeometry(0.05, 0.02, 8, 16), PALETTE.goldAccent, [0.2, 1, 3.06], [0, 0, 0], "Knocker");

// --- WINDOWS (Arched) ---
function addArchedWindow(pos, name) {
    addMesh(new THREE.BoxGeometry(0.6, 0.8, 0.1), PALETTE.windowGlow, pos, [0, 0, 0], name + "_Base");
    addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 8, 1, false, 0, Math.PI), PALETTE.windowGlow, [pos[0], pos[1] + 0.4, pos[2]], [Math.PI/2, 0, Math.PI/2], name + "_Arch");
    // Mullions
    addMesh(new THREE.BoxGeometry(0.05, 1, 0.12), PALETTE.richBrown, [pos[0], pos[1] + 0.1, pos[2]], [0, 0, 0], name + "_MullionV");
    addMesh(new THREE.BoxGeometry(0.6, 0.05, 0.12), PALETTE.richBrown, [pos[0], pos[1], pos[2]], [0, 0, 0], name + "_MullionH");
}

// Ground Floor Windows
addArchedWindow([-1.2, 0.8, 3.01], "WindowGF_L");
addArchedWindow([1.2, 0.8, 3.01], "WindowGF_R");
addArchedWindow([3.75, 0.8, 3.26], "WindowGF_Side");

// Second Floor Windows
addArchedWindow([-1.2, 2.4, 3.01], "Window2F_L");
addArchedWindow([0, 2.4, 3.01], "Window2F_C");
addArchedWindow([1.2, 2.4, 3.01], "Window2F_R");

// Dormer Windows
addMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), PALETTE.stoneWalls, [0, 6.2, 2.5], [0, 0, 0], "DormerBody");
addMesh(new THREE.ConeGeometry(0.5, 0.4, 4), PALETTE.darkRoof, [0, 6.6, 2.5], [0, Math.PI/4, 0], "DormerRoof");
addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.1), PALETTE.windowGlow, [0, 6.2, 2.81], [0, 0, 0], "DormerWindow");

// --- PROPS ---
// Chimney
addMesh(new THREE.BoxGeometry(0.8, 3, 0.8), PALETTE.stoneGrey, [-1.2, 7, -1], [0, 0, 0], "Chimney");
addMesh(new THREE.BoxGeometry(1, 0.2, 1), PALETTE.stoneGrey, [-1.2, 8.5, -1], [0, 0, 0], "ChimneyCap");

// Fence
for(let i = -3; i <= 3; i+= 0.6) {
    if (Math.abs(i) < 0.8) continue; // Gate gap
    addMesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), PALETTE.ironGrey, [i, 0.4, 5], [0, 0, 0], "FenceBar_" + i);
    addMesh(new THREE.ConeGeometry(0.04, 0.1, 4), PALETTE.ironGrey, [i, 0.85, 5], [0, 0, 0], "FenceTip_" + i);
}
// Fence Rails
addMesh(new THREE.BoxGeometry(6, 0.03, 0.03), PALETTE.ironGrey, [0, 0.2, 5], [0, 0, 0], "FenceRailB");
addMesh(new THREE.BoxGeometry(6, 0.03, 0.03), PALETTE.ironGrey, [0, 0.6, 5], [0, 0, 0], "FenceRailT");

// Hedge
addMesh(new THREE.BoxGeometry(5.8, 0.5, 0.4), PALETTE.greenIvy, [0, 0.25, 4.7], [0, 0, 0], "Hedge");

// Ivy
addMesh(new THREE.BoxGeometry(0.1, 2, 1.2), PALETTE.greenIvy, [-2.01, 1, 0], [0, 0, 0.1], "IvyCluster1");
addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.8), PALETTE.greenIvy, [-2.01, 0.75, 1.5], [0, 0, -0.1], "IvyCluster2");

// Coat of Arms
addMesh(new THREE.BoxGeometry(0.4, 0.5, 0.05), PALETTE.goldAccent, [0, 2.4, 3.05], [0, 0, 0], "CoatOfArmsBorder");
addMesh(new THREE.BoxGeometry(0.3, 0.4, 0.06), 0xAA0000, [0, 2.4, 3.05], [0, 0, 0], "CoatOfArmsInner");

// Lanterns
function addLantern(pos, name) {
    addMesh(new THREE.BoxGeometry(0.15, 0.25, 0.15), PALETTE.richBrown, pos, [0, 0, 0], name + "_Frame");
    addMesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), PALETTE.windowGlow, pos, [0, 0, 0], name + "_Glow");
}
addLantern([-1.3, 1, 3.1], "LanternL");
addLantern([1.3, 1, 3.1], "LanternR");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
