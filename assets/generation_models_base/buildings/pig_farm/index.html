<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig Farm - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Pig Farm</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Pig Farm - Three.js Geometry Snippet
// Generated for a low-poly stylized Pig Farm

const PALETTE = {
    styWalls: 0xC4A56E,
    roof: 0x5C3A1E,
    fence: 0x6B4226,
    pig: 0xF0B0B0,
    pigDetails: 0xD08080,
    mud: 0x8B7355,
    mudDark: 0x5D4E3A,
    trough: 0x808080,
    grain: 0xC4A060,
    grass: 0x5A8F4A,
    hay: 0xD4B36D,
    water: 0x4A90E2
};

// 1. BASE / GROUND
// Grass outside
addMesh(new THREE.BoxGeometry(12, 0.2, 12), PALETTE.grass, [0, -0.1, 0], [0, 0, 0], "GrassBase");
// Mud inside the pen area
addMesh(new THREE.BoxGeometry(6, 0.22, 6), PALETTE.mud, [2.5, -0.09, 0], [0, 0, 0], "PenMud");

// 2. STY BUILDING (The Barn)
// Main body
addMesh(new THREE.BoxGeometry(4, 2, 6), PALETTE.styWalls, [-2.5, 1, 0], [0, 0, 0], "StyWalls");
// Roof (Two slopes)
addMesh(new THREE.BoxGeometry(2.5, 0.2, 6.2), PALETTE.roof, [-3.4, 2.4, 0], [0, 0, -Math.PI / 6], "RoofLeft");
addMesh(new THREE.BoxGeometry(2.5, 0.2, 6.2), PALETTE.roof, [-1.6, 2.4, 0], [0, 0, Math.PI / 6], "RoofRight");

// 3. THE PEN (Fencing)
const fenceHeight = 0.8;
const postGeo = new THREE.BoxGeometry(0.15, fenceHeight, 0.15);
const railGeoH = new THREE.BoxGeometry(3, 0.1, 0.05);
const railGeoV = new THREE.BoxGeometry(0.05, 0.1, 6);

// Posts and Rails for the pen enclosure (Approx 6x6 area centered at 2.5, 0, 0)
// Right side fence
addMesh(postGeo, PALETTE.fence, [5.5, fenceHeight/2, 3], [0,0,0], "FencePost_R1");
addMesh(postGeo, PALETTE.fence, [5.5, fenceHeight/2, -3], [0,0,0], "FencePost_R2");
addMesh(postGeo, PALETTE.fence, [5.5, fenceHeight/2, 0], [0,0,0], "FencePost_R3");
addMesh(new THREE.BoxGeometry(0.05, 0.1, 6), PALETTE.fence, [5.5, 0.3, 0], [0,0,0], "FenceRail_R_Lower");
addMesh(new THREE.BoxGeometry(0.05, 0.1, 6), PALETTE.fence, [5.5, 0.6, 0], [0,0,0], "FenceRail_R_Upper");

// Front side fence (z = 3)
addMesh(postGeo, PALETTE.fence, [2.5, fenceHeight/2, 3], [0,0,0], "FencePost_F1");
addMesh(new THREE.BoxGeometry(6, 0.1, 0.05), PALETTE.fence, [2.5, 0.3, 3], [0,0,0], "FenceRail_F_Lower");
addMesh(new THREE.BoxGeometry(6, 0.1, 0.05), PALETTE.fence, [2.5, 0.6, 3], [0,0,0], "FenceRail_F_Upper");

// Back side fence (z = -3)
addMesh(postGeo, PALETTE.fence, [2.5, fenceHeight/2, -3], [0,0,0], "FencePost_B1");
addMesh(new THREE.BoxGeometry(6, 0.1, 0.05), PALETTE.fence, [2.5, 0.3, -3], [0,0,0], "FenceRail_B_Lower");
addMesh(new THREE.BoxGeometry(6, 0.1, 0.05), PALETTE.fence, [2.5, 0.6, -3], [0,0,0], "FenceRail_B_Upper");

// Connecting posts to the sty
addMesh(postGeo, PALETTE.fence, [-0.5, fenceHeight/2, 3], [0,0,0], "FencePost_ConnF");
addMesh(postGeo, PALETTE.fence, [-0.5, fenceHeight/2, -3], [0,0,0], "FencePost_ConnB");

// 4. THE PIGS (Cute low-poly shapes)
function createPig(x, z, rotY, name) {
    const groupName = name || "Pig";
    // Body
    addMesh(new THREE.BoxGeometry(0.6, 0.4, 0.4), PALETTE.pig, [x, 0.3, z], [0, rotY, 0], groupName + "_Body");
    // Head
    addMesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), PALETTE.pig, [x + Math.cos(rotY)*0.4, 0.4, z - Math.sin(rotY)*0.4], [0, rotY, 0], groupName + "_Head");
    // Snout
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 0.15), PALETTE.pigDetails, [x + Math.cos(rotY)*0.55, 0.38, z - Math.sin(rotY)*0.55], [0, rotY, 0], groupName + "_Snout");
    // Legs
    const legGeo = new THREE.BoxGeometry(0.1, 0.2, 0.1);
    addMesh(legGeo, PALETTE.pig, [x - 0.2, 0.1, z - 0.1], [0, 0, 0], groupName + "_Leg1");
    addMesh(legGeo, PALETTE.pig, [x + 0.2, 0.1, z - 0.1], [0, 0, 0], groupName + "_Leg2");
    addMesh(legGeo, PALETTE.pig, [x - 0.2, 0.1, z + 0.1], [0, 0, 0], groupName + "_Leg3");
    addMesh(legGeo, PALETTE.pig, [x + 0.2, 0.1, z + 0.1], [0, 0, 0], groupName + "_Leg4");
}

createPig(2, 1, Math.PI / 4, "Pig1");
createPig(4, -1.5, -Math.PI / 6, "Pig2");
createPig(1.5, -2, Math.PI, "Pig3");

// 5. PROPS
// Feeding Trough
addMesh(new THREE.BoxGeometry(1.5, 0.3, 0.6), PALETTE.trough, [1, 0.15, 0], [0, 0, 0], "TroughBase");
// Grain in trough
addMesh(new THREE.BoxGeometry(1.3, 0.1, 0.4), PALETTE.grain, [1, 0.3, 0], [0, 0, 0], "TroughGrain");

// Grain Sacks
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 6), PALETTE.grain, [-0.5, 0.3, 2.2], [0.2, 0, 0.1], "GrainSack1");
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 6), PALETTE.grain, [-0.8, 0.3, 1.8], [-0.1, 0.4, 0], "GrainSack2");

// Mud Puddles
addMesh(new THREE.BoxGeometry(1.5, 0.05, 1.2), PALETTE.mudDark, [3.5, 0.12, 1.5], [0, 0.5, 0], "MudPuddle1");
addMesh(new THREE.BoxGeometry(1, 0.05, 1), PALETTE.mudDark, [1.5, 0.12, -1.5], [0, -0.2, 0], "MudPuddle2");

// Water Bucket
addMesh(new THREE.CylinderGeometry(0.2, 0.15, 0.4, 8), PALETTE.trough, [0.5, 0.2, -1.5], [0, 0, 0], "Bucket");
addMesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 8), PALETTE.water, [0.5, 0.38, -1.5], [0, 0, 0], "BucketWater");

// Hay Bales
addMesh(new THREE.BoxGeometry(0.6, 0.4, 0.8), PALETTE.hay, [-1.5, 0.2, -1.5], [0, 0.4, 0], "HayBale1");
addMesh(new THREE.BoxGeometry(0.6, 0.4, 0.8), PALETTE.hay, [-1.2, 0.2, -2.2], [0, -0.2, 0], "HayBale2");

// Door opening (represented as a darker area or just a gap in the wall)
addMesh(new THREE.BoxGeometry(0.1, 1.5, 1.2), 0x221100, [-0.5, 0.75, 0], [0, 0, 0], "StyDoor");

// Grass Tufts (simple cones)
const tuftGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
addMesh(tuftGeo, PALETTE.grass, [-5, 0.15, 5], [0,0,0], "GrassTuft1");
addMesh(tuftGeo, PALETTE.grass, [-4.5, 0.15, 4.2], [0,0,0], "GrassTuft2");
addMesh(tuftGeo, PALETTE.grass, [5, 0.15, -5], [0,0,0], "GrassTuft3");
addMesh(tuftGeo, PALETTE.grass, [4.5, 0.15, -4.2], [0,0,0], "GrassTuft4");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
