<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siege Workshop - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Siege Workshop</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        
// Siege Workshop - Low Poly 3D Model
// Palette
const PALETTE = {
    darkWood: 0x5C3A1E,
    ironGrey: 0x4A4A4A,
    warmBrown: 0xA0724A,
    stoneGrey: 0x8A8A7A,
    chainGrey: 0x6A6A6A,
    ropeTan: 0xD2A86E,
    earthBrown: 0x6B4226
};

// 1. Foundation and Ground
addMesh(new THREE.BoxGeometry(12, 0.2, 10), PALETTE.earthBrown, [0, -0.1, 0], [0, 0, 0], "Ground");
addMesh(new THREE.BoxGeometry(10, 0.4, 8), PALETTE.stoneGrey, [0, 0.2, 0], [0, 0, 0], "StoneFoundation");

// 2. Heavy Timber Posts
const postGeo = new THREE.BoxGeometry(0.6, 4, 0.6);
addMesh(postGeo, PALETTE.darkWood, [-4.5, 2.2, -3.5], [0, 0, 0], "Post_BL");
addMesh(postGeo, PALETTE.darkWood, [0, 2.2, -3.5], [0, 0, 0], "Post_BC");
addMesh(postGeo, PALETTE.darkWood, [4.5, 2.2, -3.5], [0, 0, 0], "Post_BR");
addMesh(postGeo, PALETTE.darkWood, [-4.5, 2.2, 3.5], [0, 0, 0], "Post_FL");
addMesh(postGeo, PALETTE.darkWood, [0, 2.2, 3.5], [0, 0, 0], "Post_FC");
addMesh(postGeo, PALETTE.darkWood, [4.5, 2.2, 3.5], [0, 0, 0], "Post_FR");

// Diagonal Braces
const braceGeo = new THREE.BoxGeometry(0.3, 1.5, 0.3);
addMesh(braceGeo, PALETTE.darkWood, [-4, 3.5, 3.5], [0, 0, Math.PI / 4], "Brace_FL");
addMesh(braceGeo, PALETTE.darkWood, [4, 3.5, 3.5], [0, 0, -Math.PI / 4], "Brace_FR");
addMesh(braceGeo, PALETTE.darkWood, [-4, 3.5, -3.5], [0, 0, Math.PI / 4], "Brace_BL");
addMesh(braceGeo, PALETTE.darkWood, [4, 3.5, -3.5], [0, 0, -Math.PI / 4], "Brace_BR");

// 3. Rear Wall
addMesh(new THREE.BoxGeometry(9.4, 3.6, 0.2), PALETTE.warmBrown, [0, 2.2, -3.5], [0, 0, 0], "RearWall");

// 4. Heavy Roof
const roofPartGeo = new THREE.BoxGeometry(6, 0.3, 9);
addMesh(roofPartGeo, PALETTE.darkWood, [-2.6, 5.2, 0], [0, 0, Math.PI / 6], "Roof_Left");
addMesh(roofPartGeo, PALETTE.darkWood, [2.6, 5.2, 0], [0, 0, -Math.PI / 6], "Roof_Right");

// Rafters
const rafterGeo = new THREE.BoxGeometry(0.3, 0.3, 8.5);
for (let i = -4; i <= 4; i += 2) {
    addMesh(rafterGeo, PALETTE.warmBrown, [-2.5, 4.8, i * 0.9], [0, 0, Math.PI / 6], `Rafter_L_${i}`);
    addMesh(rafterGeo, PALETTE.warmBrown, [2.5, 4.8, i * 0.9], [0, 0, -Math.PI / 6], `Rafter_R_${i}`);
}

// 5. The Battering Ram
// Ram Log
const ramLog = addMesh(new THREE.CylinderGeometry(0.5, 0.5, 8, 8), PALETTE.darkWood, [0, 1.8, 0], [Math.PI / 2, 0, 0], "RamLog");
// Iron Head
addMesh(new THREE.ConeGeometry(0.7, 1.5, 4), PALETTE.ironGrey, [0, 1.8, 4.5], [Math.PI / 2, 0, 0], "RamHead");

// Cradle for the Ram
const cradleBaseGeo = new THREE.BoxGeometry(3, 0.4, 0.6);
const cradlePostGeo = new THREE.BoxGeometry(0.4, 2, 0.4);
// Front Cradle
addMesh(cradleBaseGeo, PALETTE.warmBrown, [0, 0.6, 2.5], [0, 0, 0], "CradleBase_F");
addMesh(cradlePostGeo, PALETTE.warmBrown, [-1.2, 1.2, 2.5], [0, 0, 0], "CradlePost_FL");
addMesh(cradlePostGeo, PALETTE.warmBrown, [1.2, 1.2, 2.5], [0, 0, 0], "CradlePost_FR");
// Back Cradle
addMesh(cradleBaseGeo, PALETTE.warmBrown, [0, 0.6, -2.5], [0, 0, 0], "CradleBase_B");
addMesh(cradlePostGeo, PALETTE.warmBrown, [-1.2, 1.2, -2.5], [0, 0, 0], "CradlePost_BL");
addMesh(cradlePostGeo, PALETTE.warmBrown, [1.2, 1.2, -2.5], [0, 0, 0], "CradlePost_BR");

// 6. Props
// Iron Bars Stack
for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 5; j++) {
        addMesh(new THREE.BoxGeometry(0.8, 0.15, 0.3), PALETTE.ironGrey, [-3.5 + i * 0.4, 0.5 + j * 0.16, -3], [0, Math.PI / 2, 0], `IronBar_${i}_${j}`);
    }
}

// Timber Pile
for (let i = 0; i < 3; i++) {
    addMesh(new THREE.CylinderGeometry(0.3, 0.3, 3, 6), PALETTE.warmBrown, [3.5, 0.7, -2.5 + i * 0.7], [0, 0, Math.PI / 2], `Log_Bottom_${i}`);
}
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 3, 6), PALETTE.warmBrown, [3.5, 1.2, -2.15], [0, 0, Math.PI / 2], "Log_Top_1");
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 3, 6), PALETTE.warmBrown, [3.5, 1.2, -2.85], [0, 0, Math.PI / 2], "Log_Top_2");

// Workbench
addMesh(new THREE.BoxGeometry(2, 0.8, 1), PALETTE.warmBrown, [-3, 0.8, 2], [0, 0, 0], "Workbench");
addMesh(new THREE.PlaneGeometry(1.2, 0.7), 0xEEEEEE, [-3, 1.21, 2], [-Math.PI / 2, 0, 0], "Blueprint");

// Forge/Anvil
addMesh(new THREE.CylinderGeometry(0.4, 0.5, 0.6, 8), PALETTE.darkWood, [3.5, 0.7, 2], [0, 0, 0], "AnvilStump");
addMesh(new THREE.BoxGeometry(0.6, 0.4, 0.3), PALETTE.ironGrey, [3.5, 1.1, 2], [0, 0, 0], "AnvilBase");
addMesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), PALETTE.ironGrey, [3.8, 1.1, 2], [0, 0, 0], "AnvilHorn");

// Chains (Simplified as torus)
addMesh(new THREE.TorusGeometry(0.3, 0.05, 8, 12), PALETTE.chainGrey, [0, 4.2, 2.5], [Math.PI/2, 0, 0], "Chain_F");
addMesh(new THREE.TorusGeometry(0.3, 0.05, 8, 12), PALETTE.chainGrey, [0, 4.2, -2.5], [Math.PI/2, 0, 0], "Chain_B");

// Rope Coils
addMesh(new THREE.TorusGeometry(0.4, 0.1, 8, 16), PALETTE.ropeTan, [-3, 0.45, 0], [Math.PI/2, 0, 0], "RopeCoil_1");
addMesh(new THREE.TorusGeometry(0.3, 0.08, 8, 16), PALETTE.ropeTan, [-3, 0.55, 0], [Math.PI/2, 0, 0], "RopeCoil_2");

console.log("Siege Workshop model generated!");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
