<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannery - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Tannery</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Tannery - Three.js Snippet
const PALETTE = {
    frame: 0x5C3A1E,
    stretchedHide: 0xC4A060,
    walls: 0xA0724A,
    foundation: 0x8A8A7A,
    rackFrames: 0x4A4A4A,
    vatLiquid: 0x7A6040,
    finishedHide: 0xD4BA8A,
    floor: 0x3D2714, // Darker brown
    bark: 0xA0724A,
    bucket: 0x5C3A1E
};

// 1. STONE FOUNDATION
addMesh(new THREE.BoxGeometry(2.8, 0.15, 2.8), PALETTE.foundation, [0, 0.075, 0], [0, 0, 0], "Foundation");
// Rough foundation details
addMesh(new THREE.BoxGeometry(0.3, 0.2, 0.3), PALETTE.foundation, [1.3, 0.1, 1.3], [0, 0.4, 0], "Foundation_Detail1");
addMesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), PALETTE.foundation, [-1.3, 0.1, 1.2], [0, -0.2, 0], "Foundation_Detail2");

// 2. MAIN WORKSHOP STRUCTURE
// Interior Floor
addMesh(new THREE.BoxGeometry(2.0, 0.05, 2.0), PALETTE.floor, [0, 0.15, 0], [0, 0, 0], "InteriorFloor");

// Walls
addMesh(new THREE.BoxGeometry(2.0, 1.2, 0.1), PALETTE.walls, [0, 0.75, -0.95], [0, 0, 0], "BackWall");
addMesh(new THREE.BoxGeometry(0.1, 1.2, 1.9), PALETTE.walls, [-0.95, 0.75, 0], [0, 0, 0], "LeftWall");
addMesh(new THREE.BoxGeometry(0.1, 1.2, 1.9), PALETTE.walls, [0.95, 0.75, 0], [0, 0, 0], "RightWall");

// Structural Beams (Front Opening)
addMesh(new THREE.BoxGeometry(0.12, 1.2, 0.12), PALETTE.frame, [-0.95, 0.75, 0.95], [0, 0, 0], "FrontBeamLeft");
addMesh(new THREE.BoxGeometry(0.12, 1.2, 0.12), PALETTE.frame, [0.95, 0.75, 0.95], [0, 0, 0], "FrontBeamRight");
addMesh(new THREE.BoxGeometry(2.0, 0.12, 0.12), PALETTE.frame, [0, 1.3, 0.95], [0, 0, 0], "FrontBeamTop");

// 3. ROOF
const roofL = new THREE.BoxGeometry(1.4, 0.08, 2.4);
addMesh(roofL, PALETTE.frame, [-0.55, 1.7, 0], [0, 0, Math.PI / 6], "RoofLeft");
const roofR = new THREE.BoxGeometry(1.4, 0.08, 2.4);
addMesh(roofR, PALETTE.frame, [0.55, 1.7, 0], [0, 0, -Math.PI / 6], "RoofRight");

// Rafters visible from front
addMesh(new THREE.BoxGeometry(0.05, 0.1, 0.1), PALETTE.frame, [0, 1.6, 1.0], [0, 0, 0], "RafterFront");

// Chimney
addMesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), PALETTE.foundation, [-0.6, 1.8, -0.6], [0, 0, 0], "Chimney");

// 4. PROPS - TANNING VATS
const vatGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.5, 8);
addMesh(vatGeo, PALETTE.rackFrames, [-0.4, 0.4, 0.3], [0, 0, 0], "Vat1");
addMesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1, 8), PALETTE.vatLiquid, [-0.4, 0.6, 0.3], [0, 0, 0], "VatLiquid1");

addMesh(vatGeo, PALETTE.rackFrames, [0.4, 0.4, -0.3], [0, 0, 0], "Vat2");
addMesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1, 8), PALETTE.vatLiquid, [0.4, 0.6, -0.3], [0, 0, 0], "VatLiquid2");

// 5. PROPS - DRYING RACKS & HIDES
function createRack(x, z, ry) {
    const rackName = `Rack_${x}_${z}`;
    addMesh(new THREE.BoxGeometry(0.05, 1.2, 0.05), PALETTE.rackFrames, [x - 0.4, 0.75, z], [0, ry, 0], rackName + "_PostL");
    addMesh(new THREE.BoxGeometry(0.05, 1.2, 0.05), PALETTE.rackFrames, [x + 0.4, 0.75, z], [0, ry, 0], rackName + "_PostR");
    addMesh(new THREE.BoxGeometry(0.9, 0.05, 0.05), PALETTE.rackFrames, [x, 1.2, z], [0, ry, 0], rackName + "_BarT");
    addMesh(new THREE.BoxGeometry(0.9, 0.05, 0.05), PALETTE.rackFrames, [x, 0.4, z], [0, ry, 0], rackName + "_BarB");
    
    // Stretched Hide
    addMesh(new THREE.BoxGeometry(0.7, 0.7, 0.02), PALETTE.stretchedHide, [x, 0.8, z], [0, ry, 0], rackName + "_Hide");
}

createRack(-1.6, 0.8, 0.2);
createRack(1.6, 0.5, -0.3);

// 6. RAW HIDE PILE (Input)
for (let i = 0; i < 5; i++) {
    addMesh(new THREE.BoxGeometry(0.5, 0.02, 0.4), PALETTE.stretchedHide, 
        [1.5, 0.16 + i * 0.03, 1.6], [0, Math.random(), 0], `RawHide_${i}`);
}

// 7. FINISHED LEATHER STACK (Output)
for (let i = 0; i < 8; i++) {
    addMesh(new THREE.BoxGeometry(0.4, 0.03, 0.4), PALETTE.finishedHide, 
        [-1.5, 0.17 + i * 0.04, 1.6], [0, 0, 0], `FinishedLeather_${i}`);
}

// 8. ADDITIONAL DETAILS
// Scraping tools
addMesh(new THREE.BoxGeometry(0.02, 0.4, 0.1), PALETTE.rackFrames, [0.85, 0.4, 0.5], [0.3, 0, 0.2], "Scraper1");

// Water bucket
addMesh(new THREE.CylinderGeometry(0.15, 0.1, 0.25, 8), PALETTE.bucket, [0, 0.25, 0.6], [0, 0, 0], "Bucket");

// Bark Pile
for (let i = 0; i < 10; i++) {
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), PALETTE.bark, 
        [0.6 + Math.random() * 0.3, 0.2, 0.6 + Math.random() * 0.3], [Math.random(), Math.random(), Math.random()], `Bark_${i}`);
}

// Drying line
addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 4), PALETTE.frame, [0, 1.0, 1.8], [0, 0, Math.PI / 2], "DryingLine");
addMesh(new THREE.BoxGeometry(0.05, 1.0, 0.05), PALETTE.frame, [-0.6, 0.5, 1.8], [0, 0, 0], "LinePostL");
addMesh(new THREE.BoxGeometry(0.05, 1.0, 0.05), PALETTE.frame, [0.6, 0.5, 1.8], [0, 0, 0], "LinePostR");
// Hides on line
addMesh(new THREE.BoxGeometry(0.3, 0.4, 0.02), PALETTE.finishedHide, [-0.2, 0.8, 1.8], [0.1, 0, 0], "LineHide1");
addMesh(new THREE.BoxGeometry(0.3, 0.4, 0.02), PALETTE.finishedHide, [0.2, 0.8, 1.8], [-0.1, 0, 0], "LineHide2");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
