<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle Ranch - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Cattle Ranch</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        
// Cattle Ranch - Low Poly 3D Model Snippet

const PALETTE = {
    fence: 0x8B5E3C,
    grass: 0x7CBA5C,
    cow: 0x8B5E3C,
    barnWalls: 0xA0724A,
    barnRoof: 0x8B4513,
    darkTimber: 0x5C3A1E,
    earth: 0x6B4226,
    hay: 0xD4B84A,
    water: 0x4A90E2,
    stone: 0x888888
};

// --- GROUND & PASTURE ---
// Main Pasture Area
addMesh(new THREE.BoxGeometry(10, 0.1, 14), PALETTE.grass, [0, -0.05, 2], [0, 0, 0], "Pasture");

// Worn Earth Patches
addMesh(new THREE.BoxGeometry(3, 0.12, 2), PALETTE.earth, [0, -0.04, 0], [0, 0.2, 0], "WornPatch_Gate");
addMesh(new THREE.BoxGeometry(2, 0.12, 1.5), PALETTE.earth, [2, -0.04, 4], [0, -0.1, 0], "WornPatch_Trough");

// --- BARN / SHED ---
// Barn Walls
addMesh(new THREE.BoxGeometry(3, 2, 2.5), PALETTE.barnWalls, [-3, 1, -3], [0, 0, 0], "Barn_Body");
// Barn Roof (Pitched)
addMesh(new THREE.BoxGeometry(3.5, 0.2, 1.8), PALETTE.barnRoof, [-3, 2.2, -3.6], [0.6, 0, 0], "Barn_Roof_Left");
addMesh(new THREE.BoxGeometry(3.5, 0.2, 1.8), PALETTE.barnRoof, [-3, 2.2, -2.4], [-0.6, 0, 0], "Barn_Roof_Right");
// Barn Door
addMesh(new THREE.BoxGeometry(1.2, 1.5, 0.1), PALETTE.darkTimber, [-2.5, 0.75, -1.75], [0, 0, 0], "Barn_Door");

// --- FENCE SYSTEM ---
const createFenceSection = (x, z, rotY, isGate = false) => {
    const groupName = isGate ? "Gate" : "FenceSection";
    // Posts
    addMesh(new THREE.CylinderGeometry(0.1, 0.1, 1), PALETTE.fence, [x, 0.5, z], [0, 0, 0], `${groupName}_Post`);
    
    if (isGate) {
        // Gate Rails (Slightly Open)
        addMesh(new THREE.BoxGeometry(2, 0.1, 0.1), PALETTE.fence, [x + 0.9, 0.7, z + 0.2], [0, 0.2, 0], "Gate_Rail_Top");
        addMesh(new THREE.BoxGeometry(2, 0.1, 0.1), PALETTE.fence, [x + 0.9, 0.3, z + 0.2], [0, 0.2, 0], "Gate_Rail_Bottom");
        addMesh(new THREE.BoxGeometry(0.1, 0.8, 2.1), PALETTE.fence, [x + 0.9, 0.5, z + 0.2], [0, 0.2, 1.1], "Gate_Brace");
    } else {
        // Standard Rails
        addMesh(new THREE.BoxGeometry(2, 0.1, 0.1), PALETTE.fence, [x + 1, 0.7, z], [0, rotY, 0], `${groupName}_Rail_Top`);
        addMesh(new THREE.BoxGeometry(2, 0.1, 0.1), PALETTE.fence, [x + 1, 0.3, z], [0, rotY, 0], `${groupName}_Rail_Bottom`);
    }
};

// Perimeter Fencing (Partial for brevity, forming the enclosure)
// Back Fence
for(let i=0; i<5; i++) createFenceSection(-5 + (i*2), 9, 0);
// Right Fence
for(let i=0; i<7; i++) createFenceSection(5, 9 - (i*2), Math.PI/2);
// Front Fence (With Gate)
createFenceSection(-5, -5, 0);
createFenceSection(-3, -5, 0, true); // The Gate
createFenceSection(-1, -5, 0);
createFenceSection(1, -5, 0);
createFenceSection(3, -5, 0);
// Left Fence
for(let i=0; i<7; i++) createFenceSection(-5, 9 - (i*2), Math.PI/2);

// --- COWS ---
const createCow = (x, z, rotY, name) => {
    // Body
    addMesh(new THREE.BoxGeometry(1.2, 0.8, 0.7), PALETTE.cow, [x, 0.7, z], [0, rotY, 0], `${name}_Body`);
    // Legs
    addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4), PALETTE.cow, [x-0.4, 0.2, z-0.2], [0, 0, 0], `${name}_Leg_FL`);
    addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4), PALETTE.cow, [x+0.4, 0.2, z-0.2], [0, 0, 0], `${name}_Leg_FR`);
    addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4), PALETTE.cow, [x-0.4, 0.2, z+0.2], [0, 0, 0], `${name}_Leg_BL`);
    addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4), PALETTE.cow, [x+0.4, 0.2, z+0.2], [0, 0, 0], `${name}_Leg_BR`);
    // Head & Neck (Grazing)
    addMesh(new THREE.CylinderGeometry(0.15, 0.15, 0.4), PALETTE.cow, [x+0.7, 0.5, z], [0, 0, 0.8], `${name}_Neck`);
    addMesh(new THREE.BoxGeometry(0.5, 0.4, 0.4), PALETTE.cow, [x+0.9, 0.3, z], [0, rotY, 0], `${name}_Head`);
    // Ears
    addMesh(new THREE.ConeGeometry(0.1, 0.2, 3), PALETTE.cow, [x+0.9, 0.5, z+0.15], [0, 0, 0], `${name}_Ear_L`);
    addMesh(new THREE.ConeGeometry(0.1, 0.2, 3), PALETTE.cow, [x+0.9, 0.5, z-0.15], [0, 0, 0], `${name}_Ear_R`);
};

createCow(2, 2, 0.5, "Cow_1");
createCow(-1, 5, -0.3, "Cow_2");

// --- PROPS ---
// Hay Trough
addMesh(new THREE.BoxGeometry(2, 0.5, 0.8), PALETTE.barnWalls, [2, 0.25, 4], [0, 0, 0], "Trough_Base");
addMesh(new THREE.BoxGeometry(1.8, 0.2, 0.6), PALETTE.hay, [2, 0.5, 4], [0, 0, 0], "Trough_Hay");

// Water Trough
addMesh(new THREE.BoxGeometry(1.5, 0.5, 1), PALETTE.stone, [-3, 0.25, 6], [0, 0, 0], "Water_Trough_Base");
addMesh(new THREE.BoxGeometry(1.3, 0.1, 0.8), PALETTE.water, [-3, 0.5, 6], [0, 0, 0], "Water_Surface");

// Hay Bales
addMesh(new THREE.BoxGeometry(0.8, 0.5, 0.5), PALETTE.hay, [-4.2, 0.25, -2], [0, 0.4, 0], "HayBale_1");
addMesh(new THREE.BoxGeometry(0.8, 0.5, 0.5), PALETTE.hay, [-4.3, 0.75, -2.1], [0, -0.2, 0], "HayBale_2");

// Grain Bucket
addMesh(new THREE.CylinderGeometry(0.2, 0.15, 0.4), PALETTE.darkTimber, [-1.5, 0.2, -1.8], [0.3, 0, 0], "Grain_Bucket");
addMesh(new THREE.SphereGeometry(0.1, 4, 4), PALETTE.hay, [-1.4, 0.1, -1.7], [0, 0, 0], "Spilled_Grain");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
