<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Mine - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Gold Mine</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Gold Mine - Low Poly 3D Model Generation Script

// 1. THE COLOR PALETTE
const PALETTE = {
    entrance: 0x5A5A5A,
    shaft: 0x1A1A1A,
    goldIndicator: 0xDAA520,
    mountainRock: 0x8A8A8A,
    warmRock: 0x9A8A7A,
    timber: 0x8B5E3C,
    goldNugget: 0xDAA520,
    goldHighlight: 0xF0D060,
    ground: 0x7A6A5A,
    railTrack: 0x4A4A4A,
    oreCart: 0x5C3A1E,
    lanternGlow: 0xFFD700,
    lanternBody: 0x333333,
    metal: 0x777777,
    vegetation: 0x3A4A2A
};

// 2. CORE STRUCTURE & GEOMETRY

// Ground
addMesh(new THREE.BoxGeometry(10, 0.5, 10), PALETTE.ground, [0, -0.25, 0], [0, 0, 0], "Ground");

// Mountain Backdrop
// A large angular mass of cuboids (Rocky Grey, Warm Grey)
addMesh(new THREE.BoxGeometry(7, 5, 4), PALETTE.mountainRock, [0, 2.5, -3], [0.1, 0.2, 0], "MountainBase");
addMesh(new THREE.BoxGeometry(5, 6, 3.5), PALETTE.warmRock, [-2.5, 3, -3.5], [-0.1, -0.1, 0.1], "MountainPeakLeft");
addMesh(new THREE.BoxGeometry(6, 5.5, 4), PALETTE.mountainRock, [3, 2.75, -3.2], [0.05, 0.3, -0.05], "MountainPeakRight");
addMesh(new THREE.BoxGeometry(4, 4, 2.5), PALETTE.warmRock, [0, 2, -1.8], [0, 0, 0], "MountainFront");

// Gold Vein in the Rock
addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), PALETTE.goldNugget, [-1.2, 1.5, -0.8], [0.2, 0.1, 0.5], "GoldVein1");
addMesh(new THREE.BoxGeometry(0.1, 1, 0.15), PALETTE.goldHighlight, [1.5, 2.2, -1], [-0.3, -0.2, 0.2], "GoldVein2");

// Mine Entrance Structure
addMesh(new THREE.BoxGeometry(2.8, 2.4, 0.8), PALETTE.entrance, [0, 1.2, -0.6], [0, 0, 0], "EntranceFrame");

// Mine Shaft Opening
addMesh(new THREE.BoxGeometry(1.8, 2, 0.1), PALETTE.shaft, [0, 1, -0.2], [0, 0, 0], "ShaftOpening");

// Support Timber Beams
addMesh(new THREE.BoxGeometry(0.2, 2.4, 0.3), PALETTE.timber, [-1, 1.2, -0.1], [0, 0, 0.02], "BeamLeft");
addMesh(new THREE.BoxGeometry(0.2, 2.4, 0.3), PALETTE.timber, [1, 1.2, -0.1], [0, 0, -0.02], "BeamRight");
addMesh(new THREE.BoxGeometry(2.4, 0.2, 0.3), PALETTE.timber, [0, 2.3, -0.1], [0.02, 0, 0], "BeamTop");

// Gold Ore Indicator
// A small yellow sphere distinguishes this from other mines
addMesh(new THREE.SphereGeometry(0.25, 8, 8), PALETTE.goldIndicator, [1.3, 1, -0.2], [0, 0, 0], "GoldIndicator");

// 3. PROPS AND ENVIRONMENT DETAILS

// Rail Tracks
addMesh(new THREE.BoxGeometry(0.1, 0.05, 4), PALETTE.railTrack, [-0.5, 0.05, 1.8], [0, 0, 0], "RailLeft");
addMesh(new THREE.BoxGeometry(0.1, 0.05, 4), PALETTE.railTrack, [0.5, 0.05, 1.8], [0, 0, 0], "RailRight");
for (let i = 0; i < 8; i++) {
    addMesh(new THREE.BoxGeometry(1.4, 0.05, 0.2), PALETTE.timber, [0, 0.02, 0.5 + i * 0.5], [0, 0, 0], `Sleeper${i}`);
}

// Ore Cart
const cart = new THREE.Group();
cart.position.set(0, 0.35, 2.8);
modelGroup.add(cart);

const cartBody = addMesh(new THREE.BoxGeometry(1.1, 0.7, 1.5), PALETTE.oreCart, [0, 0, 0], [0, 0, 0], "CartBody");
cart.add(cartBody);
// Wheels
for (let x of [-0.5, 0.5]) {
    for (let z of [-0.5, 0.5]) {
        const wheel = addMesh(new THREE.CylinderGeometry(0.18, 0.18, 0.12, 8), PALETTE.railTrack, [x, -0.35, z], [0, 0, Math.PI/2], "Wheel");
        cart.add(wheel);
    }
}
// Sparse Gold in cart
for (let i = 0; i < 3; i++) {
    const nugget = addMesh(new THREE.IcosahedronGeometry(0.2, 0), Math.random() > 0.3 ? PALETTE.goldNugget : PALETTE.goldHighlight, 
        [(Math.random()-0.5)*0.6, 0.35, (Math.random()-0.5)*0.8], [Math.random(), Math.random(), Math.random()], "CartGold");
    cart.add(nugget);
}

// Gold Pile
for (let i = 0; i < 8; i++) {
    const x = -1.8 + (Math.random() - 0.5) * 1;
    const z = 1.2 + (Math.random() - 0.5) * 1;
    const y = 0.1 + Math.random() * 0.3;
    addMesh(new THREE.IcosahedronGeometry(0.15 + Math.random() * 0.15, 0), 
        Math.random() > 0.4 ? PALETTE.goldNugget : PALETTE.goldHighlight, [x, y, z], 
        [Math.random(), Math.random(), Math.random()], `GoldPile${i}`);
}

// Lantern
addMesh(new THREE.BoxGeometry(0.18, 0.28, 0.18), PALETTE.lanternBody, [-1.2, 1.6, -0.3], [0, 0, 0.1], "LanternBody");
const lanternGlow = addMesh(new THREE.BoxGeometry(0.12, 0.18, 0.12), PALETTE.lanternGlow, [-1.2, 1.6, -0.3], [0, 0, 0.1], "LanternGlow");
const lanternLight = new THREE.PointLight(PALETTE.lanternGlow, 2, 4);
lanternLight.position.set(-1.2, 1.6, -0.1);
modelGroup.add(lanternLight);

// Pickaxe and Panning Pan
// Pickaxe
addMesh(new THREE.BoxGeometry(0.06, 0.9, 0.06), PALETTE.timber, [1.4, 0.45, 0.3], [0, 0, -0.1], "PickaxeHandle");
addMesh(new THREE.TorusGeometry(0.35, 0.05, 4, 8, Math.PI), PALETTE.metal, [1.4, 0.9, 0.3], [0, Math.PI/2, Math.PI/2 - 0.1], "PickaxeHead");
// Panning Pan
addMesh(new THREE.CylinderGeometry(0.3, 0.2, 0.08, 12), PALETTE.metal, [1.8, 0.04, 1.2], [0, 0, 0], "PanningPan");
addMesh(new THREE.IcosahedronGeometry(0.05, 0), PALETTE.goldNugget, [1.8, 0.1, 1.2], [0, 0, 0], "PanNugget");

// Sacks or Crates
addMesh(new THREE.BoxGeometry(0.5, 0.6, 0.5), PALETTE.timber, [-1.8, 0.3, 2.5], [0, 0.2, 0], "Crate");
addMesh(new THREE.SphereGeometry(0.3, 6, 6), 0x9A8A7A, [-1.4, 0.3, 2.8], [0, 0, 0], "Sack");

// Sparse Mountain Vegetation
for (let i = 0; i < 6; i++) {
    const x = 3 + Math.random() * 2.5;
    const z = 1 + Math.random() * 3;
    addMesh(new THREE.IcosahedronGeometry(0.2 + Math.random() * 0.2, 0), PALETTE.vegetation, [x, 0.2, z], [0, 0, 0], "Shrub");
}

// 4. LIGHTING AND PRESENTATION
scene.background = new THREE.Color(0xAABBCC); // Mountain day sky
sun.intensity = 1.4;
sun.color.setHex(0xFFF5E0); // Warm sunlight
const ambient = scene.children.find(c => c instanceof THREE.AmbientLight);
if (ambient) {
    ambient.intensity = 0.5;
    ambient.color.setHex(0xFFE0B0); // Warm ambient fill
}

// Gold Pile accent light
const goldAccent = new THREE.PointLight(0xFFA500, 1.5, 3);
goldAccent.position.set(-1.8, 0.5, 1.2);
modelGroup.add(goldAccent);

camera.position.set(10, 8, 10);
orbit.update();

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
