<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windmill - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Windmill</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        
const PALETTE = {
    tower: 0xD0C8B0,
    roof: 0x5C3A1E,
    sails: 0xF0EDE6,
    wood: 0xA0724A,
    frames: 0x5C3A1E,
    foundation: 0xB0A080,
    stone: 0x8C8C8C,
    grain: 0xC4A060,
    flour: 0xF0E8D8
};

// 1. Foundation & Base
addMesh(new THREE.CylinderGeometry(2.2, 2.4, 0.2, 8), PALETTE.foundation, [0, 0.1, 0], [0, Math.PI/8, 0], "Foundation");
addMesh(new THREE.CylinderGeometry(1.8, 2.0, 0.8, 8), PALETTE.stone, [0, 0.6, 0], [0, Math.PI/8, 0], "StoneBase");

// 2. Main Tower
addMesh(new THREE.CylinderGeometry(1.3, 1.8, 6, 8), PALETTE.tower, [0, 4, 0], [0, Math.PI/8, 0], "TowerBody");

// 3. Roof/Cap
addMesh(new THREE.ConeGeometry(1.6, 2, 8), PALETTE.roof, [0, 8, 0], [0, Math.PI/8, 0], "RoofCap");

// 4. Door and Windows
addMesh(new THREE.BoxGeometry(0.8, 1.2, 0.2), PALETTE.frames, [0, 1.1, 1.8], [0, 0, 0], "Door");
addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.2), PALETTE.frames, [0.8, 3.5, 1.4], [0, Math.PI/4, 0], "Window1");
addMesh(new THREE.BoxGeometry(0.4, 0.4, 0.2), PALETTE.frames, [-0.8, 5.5, 1.1], [0, -Math.PI/6, 0], "Window2");

// 5. Sails Mechanism
const axle = addMesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8), PALETTE.wood, [0, 7.5, 1.3], [Math.PI/2, 0, 0], "Axle");

const sailsGroup = new THREE.Group();
sailsGroup.position.set(0, 7.5, 1.7);
modelGroup.add(sailsGroup);

const createSail = (rotZ) => {
    const group = new THREE.Group();
    group.rotation.z = rotZ;
    
    // Main arm
    const armGeo = new THREE.BoxGeometry(0.15, 3.5, 0.15);
    const arm = new THREE.Mesh(armGeo, createMat(PALETTE.wood));
    arm.position.y = 1.75;
    arm.castShadow = true;
    group.add(arm);
    
    // Cloth
    const clothGeo = new THREE.BoxGeometry(1.2, 3, 0.05);
    const cloth = new THREE.Mesh(clothGeo, createMat(PALETTE.sails));
    cloth.position.set(0.6, 1.8, 0.1);
    cloth.rotation.y = 0.1; // Slight angle for wind catch
    cloth.castShadow = true;
    group.add(cloth);
    
    return group;
};

sailsGroup.add(createSail(0));
sailsGroup.add(createSail(Math.PI / 2));
sailsGroup.add(createSail(Math.PI));
sailsGroup.add(createSail(3 * Math.PI / 2));

// 6. Props (Sacks)
const createSack = (color, pos, name) => {
    const sack = addMesh(new THREE.SphereGeometry(0.3, 8, 8), color, pos, [0, 0, 0], name);
    sack.scale.set(1, 1.2, 0.8);
    return sack;
};

createSack(PALETTE.grain, [1.5, 0.3, 1.5], "GrainSack1");
createSack(PALETTE.grain, [1.8, 0.3, 1.2], "GrainSack2");
createSack(PALETTE.flour, [-1.5, 0.3, 1.5], "FlourSack1");

// 7. Millstone
const millstone = addMesh(new THREE.CylinderGeometry(0.6, 0.6, 0.2, 12), PALETTE.stone, [1.8, 0.6, 0], [0, 0, Math.PI/2], "Millstone");

// Animation logic for sails
function animateSails() {
    requestAnimationFrame(animateSails);
    sailsGroup.rotation.z -= 0.02; // 2.0 rad/s is quite fast, let's stick to 0.02 per frame (~1.2 rad/s) or adjust
}
animateSails();

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
