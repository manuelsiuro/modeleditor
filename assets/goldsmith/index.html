<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldsmith - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Goldsmith</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Goldsmith / Mint - Low Poly 3D Model Generation Script

// 1. THE COLOR PALETTE
const PALETTE = {
    walls: 0xC8C0B0,        // Light Grey / Beige
    roof: 0x5A5A5A,         // Dark Grey
    goldAccent: 0xDAA520,   // Bright Yellow / Gold
    goldBar: 0xFFD700,      // Rich Gold
    goldOre: 0xB8960A,      // Dull Gold
    coal: 0x1E1E1E,         // Coal Black
    door: 0x5C3A1E,         // Dark Brown
    chimney: 0x4A4A4A,      // Dark Grey
    foundation: 0x8C8C8C,   // Stone Grey
    windowGlow: 0xFFFF00,   // Yellow Glow
    smokeGrey: 0x888888,
    smokeWhite: 0xEEEEEE
};

// 2. CORE STRUCTURE & GEOMETRY

// Foundation
addMesh(new THREE.BoxGeometry(5.5, 0.4, 5.5), PALETTE.foundation, [0, 0.2, 0], [0, 0, 0], "Foundation");

// Main Building (Cuboid)
addMesh(new THREE.BoxGeometry(4.5, 3.5, 4.5), PALETTE.walls, [0, 1.75 + 0.4, 0], [0, 0, 0], "MainBuilding");

// Roof (Slightly sloped or flat cuboid)
addMesh(new THREE.BoxGeometry(5, 0.5, 5), PALETTE.roof, [0, 3.5 + 0.4 + 0.25, 0], [0, 0, 0], "RoofBase");
// Small pyramid/cube gold accent on roof
addMesh(new THREE.CylinderGeometry(0, 1, 1, 4), PALETTE.goldAccent, [0, 4.2 + 0.5, 0], [0, Math.PI / 4, 0], "GoldRoofAccent");

// Chimney
const chimney = addMesh(new THREE.BoxGeometry(0.6, 1.5, 0.6), PALETTE.chimney, [1.5, 4.5, 1.5], [0, 0, 0], "Chimney");

// Doorway
addMesh(new THREE.BoxGeometry(1.2, 2, 0.2), PALETTE.door, [0, 1 + 0.4, 2.25], [0, 0, 0], "Door");
// Door Trim/Frame
addMesh(new THREE.BoxGeometry(1.4, 2.1, 0.1), PALETTE.goldAccent, [0, 1.05 + 0.4, 2.3], [0, 0, 0], "DoorFrame");

// Windows
const windowGeo = new THREE.BoxGeometry(0.8, 1, 0.1);
const windowMat = new THREE.MeshStandardMaterial({ color: PALETTE.windowGlow, emissive: PALETTE.windowGlow, emissiveIntensity: 0.5 });
const winLeft = addMesh(windowGeo, windowMat, [-1.5, 2.5, 2.25], [0, 0, 0], "WindowLeft");
const winRight = addMesh(windowGeo, windowMat, [1.5, 2.5, 2.25], [0, 0, 0], "WindowRight");
addMesh(windowGeo, windowMat, [2.25, 2.5, 0], [0, Math.PI / 2, 0], "WindowSide");

// 3. PROPS AND ENVIRONMENT DETAILS

// Gold Bars (Output) - Trapezoidal stacks
function createGoldBar(pos) {
    const bar = addMesh(new THREE.BoxGeometry(0.4, 0.2, 0.8), PALETTE.goldBar, pos, [0, 0, 0], "GoldBar");
    // Simple trapezoid effect by scaling top face if we had custom geo, but Box is fine for low poly
    return bar;
}
createGoldBar([-1.5, 0.5, 3]);
createGoldBar([-1.5, 0.7, 3]);
createGoldBar([-1.9, 0.5, 3]);

// Gold Ore (Input) - Rough irregular cubes
for (let i = 0; i < 5; i++) {
    addMesh(new THREE.IcosahedronGeometry(0.25, 0), PALETTE.goldOre, [2 + Math.random(), 0.5, 2 + Math.random()], [Math.random(), Math.random(), Math.random()], "GoldOre");
}

// Coal Pile (Input)
for (let i = 0; i < 10; i++) {
    addMesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), PALETTE.coal, [-2.5 + Math.random(), 0.5, -2 + Math.random()], [Math.random(), Math.random(), Math.random()], "Coal");
}

// Crucible
addMesh(new THREE.CylinderGeometry(0.3, 0.2, 0.4, 8), PALETTE.chimney, [1.2, 0.6, 2.8], [0, 0, 0], "Crucible");

// Precision Scale
const scaleGroup = new THREE.Group();
scaleGroup.position.set(-2, 0.4, 1.5);
modelGroup.add(scaleGroup);
addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), PALETTE.foundation, [0, 0.75, 0], [0, 0, 0], "ScalePost").parent = scaleGroup;
addMesh(new THREE.BoxGeometry(1.2, 0.05, 0.05), PALETTE.foundation, [0, 1.4, 0], [0, 0, 0], "ScaleBeam").parent = scaleGroup;
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.02, 12), PALETTE.goldBar, [-0.5, 0.8, 0], [0, 0, 0], "ScalePanL").parent = scaleGroup;
addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.02, 12), PALETTE.goldBar, [0.5, 0.8, 0], [0, 0, 0], "ScalePanR").parent = scaleGroup;

// Workbench
addMesh(new THREE.BoxGeometry(1.5, 0.8, 0.8), PALETTE.door, [-1.8, 0.8, -1.5], [0, 0, 0], "Workbench");

// Strongbox/Chest
const chest = new THREE.Group();
chest.position.set(1.8, 0.4, -1.8);
modelGroup.add(chest);
addMesh(new THREE.BoxGeometry(0.8, 0.5, 0.6), PALETTE.door, [0, 0.25, 0], [0, 0, 0], "ChestBase").parent = chest;
addMesh(new THREE.CylinderGeometry(0.4, 0.4, 0.8, 8, 1, false, 0, Math.PI), PALETTE.door, [0, 0.5, 0], [0, 0, Math.PI / 2], "ChestTop").parent = chest;
addMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), PALETTE.goldBar, [0, 0.4, 0.3], [0, 0, 0], "ChestLatch").parent = chest;

// 4. ANIMATION & RUNTIME EFFECTS

const particles = [];
const smokeMaterial = new THREE.MeshStandardMaterial({ color: PALETTE.smokeGrey, transparent: true, opacity: 0.8, flatShading: true });

function spawnSmoke() {
    const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), smokeMaterial.clone());
    p.position.set(1.5, 5.2, 1.5);
    p.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.02, 0.05 + Math.random() * 0.05, (Math.random() - 0.5) * 0.02);
    p.life = 1.0;
    scene.add(p);
    particles.push(p);
}

let lastSmokeTime = 0;
function updateGoldsmith(time) {
    // Smoke emission: 3/s
    if (time - lastSmokeTime > 333) {
        spawnSmoke();
        lastSmokeTime = time;
    }

    // Update smoke particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.velocity);
        p.life -= 0.01;
        p.scale.setScalar(p.life * 1.5);
        p.material.opacity = p.life;
        // Fade grey to white
        p.material.color.lerpColors(new THREE.Color(PALETTE.smokeGrey), new THREE.Color(PALETTE.smokeWhite), 1 - p.life);
        
        if (p.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }

    // Emissive glow pulse
    const pulse = (Math.sin(time * 0.003) + 1) / 2;
    windowMat.emissiveIntensity = 0.2 + pulse * 0.8;
}

// Inject into the render loop
const originalAnimate = animate;
animate = function() {
    updateGoldsmith(performance.now());
    originalAnimate();
};

// 5. LIGHTING AND PRESENTATION
scene.background = new THREE.Color(0xDDEEFF); // Bright morning sky
sun.intensity = 1.5;
sun.color.setHex(0xFFF0D0); // Golden sunlight
sun.position.set(10, 15, 10);

camera.position.set(12, 10, 12);
orbit.update();

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
