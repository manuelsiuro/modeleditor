<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inn Tavern - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Inn Tavern</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        
// Inn Tavern Low-Poly Model Snippet
// Palette from prompt
const PALETTE = {
    warmWood: 0xA0724A,
    amberGlow: 0xFFB030,
    darkBrown: 0x5C3A1E,
    signGreen: 0x4A8C3F,
    stoneGrey: 0x8A8A7A,
    roofBrown: 0x6B4226,
    lanternGold: 0xFFD700,
    windowWarm: 0xFFD080,
    earthPath: 0x8B7355,
    smokeGrey: 0xCCCCCC
};

// 1. MAIN BUILDING STRUCTURE
// Main Hall (Wide Cuboid)
addMesh(new THREE.BoxGeometry(6, 4, 4), PALETTE.warmWood, [0, 2, 0], [0, 0, 0], "MainBuilding");

// Subtle timber plank lines (horizontal strips)
for (let i = 1; i <= 3; i++) {
    addMesh(new THREE.BoxGeometry(6.1, 0.05, 4.1), PALETTE.darkBrown, [0, i, 0], [0, 0, 0], `PlankLine_${i}`);
}

// 2. ROOF
// Pitched Roof Left Slope
addMesh(new THREE.BoxGeometry(3.5, 0.2, 4.5), PALETTE.roofBrown, [-1.5, 5, 0], [0, 0, Math.PI / 6], "RoofLeft");
// Pitched Roof Right Slope
addMesh(new THREE.BoxGeometry(3.5, 0.2, 4.5), PALETTE.roofBrown, [1.5, 5, 0], [0, 0, -Math.PI / 6], "RoofRight");

// Dormer Window
addMesh(new THREE.BoxGeometry(1.2, 1, 1), PALETTE.warmWood, [0, 4.5, 1.8], [0, 0, 0], "DormerBase");
addMesh(new THREE.BoxGeometry(0.8, 0.8, 0.1), PALETTE.windowWarm, [0, 4.5, 2.31], [0, 0, 0], "DormerWindowGlow");
// Dormer Roof
addMesh(new THREE.BoxGeometry(0.8, 0.1, 1.2), PALETTE.roofBrown, [-0.4, 5.1, 1.8], [0, 0, Math.PI / 6], "DormerRoofL");
addMesh(new THREE.BoxGeometry(0.8, 0.1, 1.2), PALETTE.roofBrown, [0.4, 5.1, 1.8], [0, 0, -Math.PI / 6], "DormerRoofR");

// 3. ENTRANCE
// Double Doors (slightly ajar)
addMesh(new THREE.BoxGeometry(0.75, 2, 0.1), PALETTE.darkBrown, [-0.4, 1, 2.05], [0, -0.2, 0], "DoorLeft");
addMesh(new THREE.BoxGeometry(0.75, 2, 0.1), PALETTE.darkBrown, [0.4, 1, 2.05], [0, 0.2, 0], "DoorRight");
// Door Light Spill (behind the doors)
addMesh(new THREE.BoxGeometry(1.4, 1.9, 0.05), PALETTE.amberGlow, [0, 1, 1.95], [0, 0, 0], "DoorInteriorGlow");
// Ground Light Spill
addMesh(new THREE.BoxGeometry(2, 0.01, 1.5), PALETTE.amberGlow, [0, 0.01, 2.8], [0, 0, 0], "GroundLightSpill");

// 4. WINDOWS
const windowPos = [
    [-2, 2.5, 2.01], [2, 2.5, 2.01], // Front
    [-2, 1.2, 2.01], [2, 1.2, 2.01], // Front lower
    [-3.01, 2, 0], [3.01, 2, 0]      // Sides
];
windowPos.forEach((pos, i) => {
    const isSide = Math.abs(pos[0]) > 3;
    addMesh(new THREE.BoxGeometry(isSide ? 0.1 : 0.8, 1, isSide ? 1.2 : 0.1), PALETTE.windowWarm, pos, [0, 0, 0], `WindowGlow_${i}`);
    // Mullions
    addMesh(new THREE.BoxGeometry(isSide ? 0.12 : 0.82, 0.05, isSide ? 1.22 : 0.12), PALETTE.darkBrown, pos, [0, 0, 0], `WindowMullionH_${i}`);
    addMesh(new THREE.BoxGeometry(isSide ? 0.12 : 0.05, 1.02, isSide ? 0.05 : 0.12), PALETTE.darkBrown, pos, [0, 0, 0], `WindowMullionV_${i}`);
});

// 5. SIGN BRACKET & SIGN
addMesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2), PALETTE.darkBrown, [0, 3, 2.5], [Math.PI / 2, 0, 0], "SignArm");
addMesh(new THREE.BoxGeometry(0.6, 0.4, 0.05), PALETTE.signGreen, [0, 2.6, 3], [0, 0, 0], "SignBoard");
addMesh(new THREE.CylinderGeometry(0.1, 0.1, 0.06), 0xFFFFFF, [0, 2.6, 3.03], [Math.PI / 2, 0, 0], "SignIcon"); // Simple Mug icon

// 6. CHIMNEY
addMesh(new THREE.BoxGeometry(0.8, 3, 0.8), PALETTE.stoneGrey, [2, 4.5, -1], [0, 0, 0], "Chimney");
addMesh(new THREE.ConeGeometry(0.3, 0.6, 4), PALETTE.smokeGrey, [2, 6.2, -1], [0, 0, 0], "SmokeCloud");

// 7. PROPS
// Barrels
const barrelPos = [
    [-3.5, 0.5, 1], [-3.5, 0.5, 0], [-3.5, 1.4, 0.5]
];
barrelPos.forEach((pos, i) => {
    addMesh(new THREE.CylinderGeometry(0.4, 0.4, 1, 8), PALETTE.darkBrown, pos, [Math.PI / 2, 0, 0], `Barrel_${i}`);
    addMesh(new THREE.CylinderGeometry(0.35, 0.35, 1.02, 8), PALETTE.warmWood, pos, [Math.PI / 2, 0, 0], `BarrelEnd_${i}`);
});

// Table & Benches
addMesh(new THREE.BoxGeometry(1.5, 0.1, 0.8), PALETTE.warmWood, [2.5, 0.6, 3], [0, 0, 0], "OutdoorTable");
addMesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), PALETTE.warmWood, [2, 0.3, 2.7], [0, 0, 0], "TableLeg1");
addMesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), PALETTE.warmWood, [3, 0.3, 2.7], [0, 0, 0], "TableLeg2");
addMesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), PALETTE.warmWood, [2, 0.3, 3.3], [0, 0, 0], "TableLeg3");
addMesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), PALETTE.warmWood, [3, 0.3, 3.3], [0, 0, 0], "TableLeg4");

addMesh(new THREE.BoxGeometry(1.5, 0.1, 0.3), PALETTE.warmWood, [2.5, 0.4, 2.4], [0, 0, 0], "Bench1");
addMesh(new THREE.BoxGeometry(1.5, 0.1, 0.3), PALETTE.warmWood, [2.5, 0.4, 3.6], [0, 0, 0], "Bench2");

// Lanterns
addMesh(new THREE.BoxGeometry(0.2, 0.3, 0.2), PALETTE.darkBrown, [-0.8, 2.2, 2.05], [0, 0, 0], "LanternFrameL");
addMesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), PALETTE.lanternGold, [-0.8, 2.2, 2.05], [0, 0, 0], "LanternGlowL");
addMesh(new THREE.BoxGeometry(0.2, 0.3, 0.2), PALETTE.darkBrown, [0.8, 2.2, 2.05], [0, 0, 0], "LanternFrameR");
addMesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), PALETTE.lanternGold, [0.8, 2.2, 2.05], [0, 0, 0], "LanternGlowR");

// 8. ENVIRONMENT
addMesh(new THREE.BoxGeometry(8, 0.05, 8), 0x3A5F0B, [0, -0.02, 0], [0, 0, 0], "GroundGrass");
addMesh(new THREE.BoxGeometry(3, 0.02, 3), PALETTE.earthPath, [0, 0.01, 3.5], [0, 0, 0], "PathWorn");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
