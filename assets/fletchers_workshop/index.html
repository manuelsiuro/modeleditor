<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fletchers Workshop - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Fletchers Workshop</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Fletcher's Workshop - Low Poly Three.js Snippet

const PALETTE = {
    targetRed: 0xC0392B,
    targetWhite: 0xF0F0F0,
    woodBrown: 0xA0724A,
    arrowShaftTan: 0xD2A86E,
    ironGrey: 0x7A7A7A,
    darkBrown: 0x5C3A1E,
    fletchingGreen: 0x4A8C3F
};

// 1. Foundation
addMesh(new THREE.BoxGeometry(6, 0.2, 5), PALETTE.darkBrown, [0, 0.1, 0], [0, 0, 0], "Foundation");

// 2. Workshop Walls
// Back wall
addMesh(new THREE.BoxGeometry(5, 3, 0.2), PALETTE.woodBrown, [0, 1.5, -2.4], [0, 0, 0], "BackWall");
// Left wall
addMesh(new THREE.BoxGeometry(0.2, 3, 5), PALETTE.woodBrown, [-2.4, 1.5, 0], [0, 0, 0], "LeftWall");
// Right wall
addMesh(new THREE.BoxGeometry(0.2, 3, 5), PALETTE.woodBrown, [2.4, 1.5, 0], [0, 0, 0], "RightWall");
// Front half-wall
addMesh(new THREE.BoxGeometry(5, 1.2, 0.2), PALETTE.woodBrown, [0, 0.6, 2.4], [0, 0, 0], "FrontHalfWall");

// Support Beams for open front
addMesh(new THREE.BoxGeometry(0.2, 2, 0.2), PALETTE.darkBrown, [-2.4, 2, 2.4], [0, 0, 0], "BeamLeft");
addMesh(new THREE.BoxGeometry(0.2, 2, 0.2), PALETTE.darkBrown, [2.4, 2, 2.4], [0, 0, 0], "BeamRight");
addMesh(new THREE.BoxGeometry(5, 0.2, 0.2), PALETTE.darkBrown, [0, 3, 2.4], [0, 0, 0], "BeamTop");

// Windows on side wall
addMesh(new THREE.BoxGeometry(0.05, 0.6, 0.8), 0x000000, [-2.4, 2, 0], [0, 0, 0], "Window1");
addMesh(new THREE.BoxGeometry(0.05, 0.6, 0.8), 0x000000, [-2.4, 2, 1.5], [0, 0, 0], "Window2");

// 3. Pitched Roof
const roofAngle = Math.PI / 6; // 30 degrees
addMesh(new THREE.BoxGeometry(3.5, 0.2, 6.5), PALETTE.darkBrown, [-1.5, 4, 0.5], [0, 0, roofAngle], "RoofLeft");
addMesh(new THREE.BoxGeometry(3.5, 0.2, 6.5), PALETTE.darkBrown, [1.5, 4, 0.5], [0, 0, -roofAngle], "RoofRight");

// Rafter ends
for (let z = -2.5; z <= 3.5; z += 1.5) {
    addMesh(new THREE.BoxGeometry(0.2, 0.1, 0.3), PALETTE.darkBrown, [-2.8, 3.2, z], [0, 0, 0], "RafterL");
    addMesh(new THREE.BoxGeometry(0.2, 0.1, 0.3), PALETTE.darkBrown, [2.8, 3.2, z], [0, 0, 0], "RafterR");
}

// 4. Workbench
addMesh(new THREE.BoxGeometry(3.5, 1, 1.5), PALETTE.woodBrown, [0, 0.7, 1.5], [0, 0, 0], "Workbench");
// Props on workbench
addMesh(new THREE.BoxGeometry(0.4, 0.05, 0.1), PALETTE.ironGrey, [-1, 1.25, 1.6], [0, 0.5, 0], "Knife");
addMesh(new THREE.PlaneGeometry(0.1, 0.2), PALETTE.fletchingGreen, [0.5, 1.25, 1.5], [Math.PI/2, 0, 0.5], "Feather1");
addMesh(new THREE.PlaneGeometry(0.1, 0.2), PALETTE.fletchingGreen, [0.7, 1.25, 1.7], [Math.PI/2, 0, -0.3], "Feather2");

// 5. Archery Target
const targetX = 6;
const targetZ = 3;
// Easel stand
addMesh(new THREE.BoxGeometry(0.1, 2, 0.1), PALETTE.darkBrown, [targetX - 0.5, 1, targetZ], [0, 0, 0.2], "StandL");
addMesh(new THREE.BoxGeometry(0.1, 2, 0.1), PALETTE.darkBrown, [targetX + 0.5, 1, targetZ], [0, 0, -0.2], "StandR");
addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), PALETTE.darkBrown, [targetX, 0.8, targetZ - 0.5], [0.3, 0, 0], "StandBack");

// Target rings (discs)
addMesh(new THREE.CylinderGeometry(0.8, 0.8, 0.1, 16), PALETTE.targetWhite, [targetX, 1.5, targetZ + 0.1], [Math.PI/2, 0, 0], "TargetBase");
addMesh(new THREE.CylinderGeometry(0.5, 0.5, 0.11, 16), PALETTE.targetRed, [targetX, 1.5, targetZ + 0.11], [Math.PI/2, 0, 0], "TargetRing1");
addMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 16), PALETTE.targetWhite, [targetX, 1.5, targetZ + 0.12], [Math.PI/2, 0, 0], "TargetRing2");
addMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.13, 16), PALETTE.targetRed, [targetX, 1.5, targetZ + 0.13], [Math.PI/2, 0, 0], "TargetBullseye");

// Arrows in target
addMesh(new THREE.CylinderGeometry(0.01, 0.01, 0.8), PALETTE.arrowShaftTan, [targetX + 0.1, 1.6, targetZ + 0.5], [Math.PI/2 - 0.2, 0.1, 0], "TargetArrow1");
addMesh(new THREE.CylinderGeometry(0.01, 0.01, 0.8), PALETTE.arrowShaftTan, [targetX - 0.2, 1.4, targetZ + 0.5], [Math.PI/2 + 0.1, -0.2, 0], "TargetArrow2");

// 6. Props
// Quiver Barrel
addMesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 8), PALETTE.darkBrown, [2, 0.7, 0], [0, 0, 0], "QuiverBarrel");
// Finished arrows in barrel
for(let i=0; i<5; i++) {
    addMesh(new THREE.CylinderGeometry(0.01, 0.01, 1.5), PALETTE.arrowShaftTan, [2 + Math.random()*0.4-0.2, 1.5, Math.random()*0.4-0.2], [0.1, i, 0], "BarrelArrow");
}

// Arrow bundle
function createArrowBundle(pos, rot) {
    const bundleName = "ArrowBundle";
    addMesh(new THREE.CylinderGeometry(0.15, 0.15, 1.2, 6), PALETTE.arrowShaftTan, pos, rot, bundleName);
    addMesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, 6), PALETTE.darkBrown, [pos[0], pos[1], pos[2]], rot, bundleName + "_Tie");
}
createArrowBundle([-1.5, 1.3, 1.5], [0, 0, Math.PI/2]); // On workbench
createArrowBundle([2, 0.7, 2], [0, 0, 0]); // Against front wall

// Bow Rack
addMesh(new THREE.BoxGeometry(0.1, 2.5, 0.1), PALETTE.darkBrown, [-2.2, 1.4, -1.5], [0, 0, 0], "RackSupportL");
addMesh(new THREE.BoxGeometry(0.1, 2.5, 0.1), PALETTE.darkBrown, [-2.2, 1.4, 0.5], [0, 0, 0], "RackSupportR");
addMesh(new THREE.BoxGeometry(0.1, 0.1, 2), PALETTE.darkBrown, [-2.2, 2.5, -0.5], [0, 0, 0], "RackTop");
// A simple "bow" shape
addMesh(new THREE.TorusGeometry(1, 0.02, 4, 8, Math.PI/2), PALETTE.woodBrown, [-2.1, 1.8, -0.5], [0, Math.PI/2, 0], "Bow1");

// Iron bars
addMesh(new THREE.BoxGeometry(0.4, 0.05, 1), PALETTE.ironGrey, [1.5, 0.25, 3.5], [0, 0.2, 0], "IronBar1");
addMesh(new THREE.BoxGeometry(0.4, 0.05, 1), PALETTE.ironGrey, [1.6, 0.3, 3.6], [0, -0.1, 0], "IronBar2");

// Feather basket
addMesh(new THREE.CylinderGeometry(0.3, 0.2, 0.5, 8), PALETTE.darkBrown, [-1.8, 0.45, 0.5], [0, 0, 0], "FeatherBasket");
addMesh(new THREE.PlaneGeometry(0.1, 0.2), PALETTE.fletchingGreen, [-1.8, 0.7, 0.5], [Math.PI/2, 0, 0], "BasketFeather");

// Wood shavings
for(let i=0; i<10; i++) {
    addMesh(new THREE.PlaneGeometry(0.05, 0.1), PALETTE.arrowShaftTan, [-1 + Math.random(), 0.21, 2 + Math.random()], [Math.PI/2, 0, Math.random()*Math.PI], "Shaving");
}

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
