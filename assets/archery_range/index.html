<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Range - Editor</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        #controls-ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; }
        .key { background: #444; padding: 2px 6px; border-radius: 4px; font-family: monospace; border: 1px solid #666; }
        button { background: #4CAF50; border: none; color: white; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; pointer-events: auto; }
        button:hover { background: #45a049; }
        button.secondary { background: #555; }
        button.secondary:hover { background: #666; }
        button.info { background: #2196F3; }
        button.info:hover { background: #0b7dda; }
        button.danger { background: #f44336; }
        button.danger:hover { background: #da190b; }
        #history-count { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div id="info">
        <h2 id="model-title" style="margin-top:0">Archery Range</h2>
        <p><span class="key">Click</span> Select | <span class="key">G, R, S</span> Modes</p>
        <p><span class="key">Ctrl + Z</span> Undo | <span class="key">P</span> Screenshot</p>
        <p><span class="key">D</span> Duplicate | <span class="key">Del</span> Delete</p>
    </div>

    <div id="history-count">History: 0 actions</div>
    <div id="controls-ui">
        <button id="export">Export .GLB</button>
        <button id="screenshot-btn" class="info">Screenshot</button>
        <button id="undo-btn" class="secondary">Undo</button>
        <button id="duplicate-btn">Duplicate</button>
        <button id="delete-btn" class="danger">Delete</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

        // --- CORE SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default sky color, can be overridden
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transform = new TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // Default Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 5); 
        sun.castShadow = true;
        scene.add(sun);

        // Container for generated models
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Utility function to make adding meshes easier in the injected code
        const createMat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1, metalness: 0 });
        const addMesh = (geo, color, pos = [0,0,0], rot = [0,0,0], name = "Object") => {
            const mesh = new THREE.Mesh(geo, typeof color === 'number' || typeof color === 'string' ? createMat(color) : color);
            mesh.position.set(...pos); 
            mesh.rotation.set(...rot);
            mesh.castShadow = true; 
            mesh.receiveShadow = true; 
            mesh.name = name;
            modelGroup.add(mesh);
            return mesh;
        };

        /* ========================================== */
        // Archery Range - Low Poly 3D Model Snippet

const PALETTE = {
    targetRed: 0xC0392B,
    targetWhite: 0xF0F0F0,
    woodBrown: 0xA0724A,
    arrowTan: 0xD2A86E,
    stoneGrey: 0x8A8A7A,
    darkBrown: 0x5C3A1E,
    strawGold: 0xD4B84A,
    groundEarth: 0x6E5B4B
};

// 1. RANGE GROUND
addMesh(new THREE.BoxGeometry(10, 0.1, 20), PALETTE.groundEarth, [0, -0.05, 0], [0, 0, 0], "RangeGround");

// 2. SHOOTING PLATFORM
// Base
addMesh(new THREE.BoxGeometry(8, 0.4, 4), PALETTE.stoneGrey, [0, 0.2, 8], [0, 0, 0], "PlatformBase");
// Posts
const postHeight = 3;
const postPos = [[-3.8, 1.7, 6.2], [3.8, 1.7, 6.2], [-3.8, 1.7, 9.8], [3.8, 1.7, 9.8]];
postPos.forEach((pos, i) => {
    addMesh(new THREE.BoxGeometry(0.2, postHeight, 0.2), PALETTE.woodBrown, pos, [0, 0, 0], `Post_${i}`);
});
// Roof
addMesh(new THREE.BoxGeometry(8.4, 0.2, 4.4), PALETTE.darkBrown, [0, 3.3, 8], [0, 0, 0], "PlatformRoof");

// 3. ARCHERY TARGETS
const targetX = [-2, 0, 2];
targetX.forEach((x, i) => {
    const targetZ = -8;
    // Easel Frame
    addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), PALETTE.darkBrown, [x - 0.3, 0.75, targetZ + 0.2], [0.2, 0, 0], `EaselLegL_${i}`);
    addMesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), PALETTE.darkBrown, [x + 0.3, 0.75, targetZ + 0.2], [0.2, 0, 0], `EaselLegR_${i}`);
    addMesh(new THREE.BoxGeometry(0.8, 0.1, 0.1), PALETTE.darkBrown, [x, 0.8, targetZ + 0.1], [0, 0, 0], `EaselCrossbar_${i}`);
    
    // Target Disc (layers)
    const targetY = 1.2;
    addMesh(new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16), PALETTE.targetWhite, [x, targetY, targetZ], [Math.PI/2, 0, 0], `TargetBase_${i}`);
    addMesh(new THREE.CylinderGeometry(0.4, 0.4, 0.02, 16), PALETTE.targetRed, [x, targetY, targetZ - 0.06], [Math.PI/2, 0, 0], `TargetRing1_${i}`);
    addMesh(new THREE.CylinderGeometry(0.3, 0.3, 0.02, 16), PALETTE.targetWhite, [x, targetY, targetZ - 0.08], [Math.PI/2, 0, 0], `TargetRing2_${i}`);
    addMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.02, 16), PALETTE.targetRed, [x, targetY, targetZ - 0.1], [Math.PI/2, 0, 0], `TargetRing3_${i}`);
    addMesh(new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16), PALETTE.targetWhite, [x, targetY, targetZ - 0.12], [Math.PI/2, 0, 0], `TargetBullseye_${i}`);

    // Embedded Arrows
    if (i === 0) {
        addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [x + 0.1, targetY + 0.1, targetZ - 0.5], [Math.PI/2 + 0.1, 0.2, 0], `Arrow_T0_1`);
        addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [x - 0.2, targetY - 0.1, targetZ - 0.5], [Math.PI/2 - 0.1, -0.1, 0], `Arrow_T0_2`);
    } else if (i === 1) {
        addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [x, targetY, targetZ - 0.5], [Math.PI/2, 0, 0], `Arrow_T1_Bull`);
    }
});

// 4. STRAW BALES (Backstop)
for(let x = -4; x <= 4; x += 1.5) {
    addMesh(new THREE.BoxGeometry(1.4, 0.8, 0.8), PALETTE.strawGold, [x, 0.4, -9.2], [0, 0, 0], `StrawBaleL1_${x}`);
    addMesh(new THREE.BoxGeometry(1.4, 0.8, 0.8), PALETTE.strawGold, [x, 1.2, -9.2], [0, 0.1, 0], `StrawBaleL2_${x}`);
}

// 5. PERIMETER FENCE
const fenceZ = [-6, -2, 2, 6];
fenceZ.forEach(z => {
    // Left side
    addMesh(new THREE.BoxGeometry(0.1, 1, 0.1), PALETTE.darkBrown, [-4.8, 0.5, z], [0, 0, 0], `FencePostL_${z}`);
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 4), PALETTE.darkBrown, [-4.8, 0.4, z + 2], [0, 0, 0], `FenceRailL1_${z}`);
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 4), PALETTE.darkBrown, [-4.8, 0.8, z + 2], [0, 0, 0], `FenceRailL2_${z}`);
    // Right side
    addMesh(new THREE.BoxGeometry(0.1, 1, 0.1), PALETTE.darkBrown, [4.8, 0.5, z], [0, 0, 0], `FencePostR_${z}`);
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 4), PALETTE.darkBrown, [4.8, 0.4, z + 2], [0, 0, 0], `FenceRailR1_${z}`);
    addMesh(new THREE.BoxGeometry(0.1, 0.1, 4), PALETTE.darkBrown, [4.8, 0.8, z + 2], [0, 0, 0], `FenceRailR2_${z}`);
});

// 6. PROPS ON PLATFORM
// Quivers
const quiverX = [-2, 0, 2];
quiverX.forEach(x => {
    addMesh(new THREE.CylinderGeometry(0.15, 0.12, 0.8), PALETTE.darkBrown, [x + 0.5, 0.8, 7.5], [0, 0, 0], `Quiver_${x}`);
    // Arrows in quiver
    addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [x + 0.5, 1.3, 7.5], [0.1, 0.1, 0], `ArrowQuiver_${x}_1`);
    addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [x + 0.55, 1.3, 7.55], [-0.1, -0.1, 0], `ArrowQuiver_${x}_2`);
});

// Bow Rack
addMesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), PALETTE.woodBrown, [-3.5, 1, 9.5], [0, 0, 0], "RackPostL");
addMesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), PALETTE.woodBrown, [-2.5, 1, 9.5], [0, 0, 0], "RackPostR");
addMesh(new THREE.BoxGeometry(1.2, 0.1, 0.1), PALETTE.woodBrown, [-3, 1.4, 9.5], [0, 0, 0], "RackBar");
// Bow (simplified)
addMesh(new THREE.TorusGeometry(0.6, 0.03, 8, 12, Math.PI), PALETTE.woodBrown, [-3, 0.8, 9.5], [0, Math.PI/2, 0], "Bow1");

// Weapon Chest
addMesh(new THREE.BoxGeometry(1, 0.6, 0.6), PALETTE.darkBrown, [3, 0.7, 9], [0, -0.4, 0], "WeaponChest");

// Benches
addMesh(new THREE.BoxGeometry(2, 0.1, 0.6), PALETTE.woodBrown, [-6, 0.45, 8], [0, Math.PI/2, 0], "BenchL");
addMesh(new THREE.BoxGeometry(0.1, 0.4, 0.4), PALETTE.woodBrown, [-6, 0.2, 7.8], [0, 0, 0], "BenchLegL1");
addMesh(new THREE.BoxGeometry(0.1, 0.4, 0.4), PALETTE.woodBrown, [-6, 0.2, 8.2], [0, 0, 0], "BenchLegL2");

addMesh(new THREE.BoxGeometry(2, 0.1, 0.6), PALETTE.woodBrown, [6, 0.45, 8], [0, Math.PI/2, 0], "BenchR");
addMesh(new THREE.BoxGeometry(0.1, 0.4, 0.4), PALETTE.woodBrown, [6, 0.2, 7.8], [0, 0, 0], "BenchLegR1");
addMesh(new THREE.BoxGeometry(0.1, 0.4, 0.4), PALETTE.woodBrown, [6, 0.2, 8.2], [0, 0, 0], "BenchLegR2");

// Scattered Arrows
addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [1, 0.02, -2], [Math.PI/2, 0.5, 0], "ScatteredArrow1");
addMesh(new THREE.CylinderGeometry(0.02, 0.02, 1), PALETTE.arrowTan, [-2, 0.02, 2], [Math.PI/2, -0.3, 0], "ScatteredArrow2");

        /* ========================================== */

        // --- UNDO HISTORY SYSTEM ---
        const history = [];
        function pushAction(action) {
            history.push(action);
            if (history.length > 50) history.shift();
            updateHistoryUI();
        }

        function undo() {
            const action = history.pop();
            if (!action) return;
            switch(action.type) {
                case 'transform':
                    action.object.position.copy(action.before.pos);
                    action.object.rotation.copy(action.before.rot);
                    action.object.scale.copy(action.before.scl);
                    transform.attach(action.object);
                    break;
                case 'add':
                    transform.detach();
                    action.object.parent.remove(action.object);
                    break;
                case 'remove':
                    action.parent.add(action.object);
                    transform.attach(action.object);
                    break;
            }
            updateHistoryUI();
        }

        function updateHistoryUI() {
            document.getElementById('history-count').innerText = `History: ${history.length} actions`;
        }

        // --- TRANSFORMATION TRACKING ---
        let transformStart = null;
        transform.addEventListener('mouseDown', () => {
            const obj = transform.object;
            if (obj) {
                transformStart = { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() };
            }
        });

        transform.addEventListener('mouseUp', () => {
            const obj = transform.object;
            if (obj && transformStart) {
                if (!obj.position.equals(transformStart.pos) || !obj.rotation.equals(transformStart.rot) || !obj.scale.equals(transformStart.scl)) {
                    pushAction({
                        type: 'transform', object: obj, before: transformStart,
                        after: { pos: obj.position.clone(), rot: obj.rotation.clone(), scl: obj.scale.clone() }
                    });
                }
            }
            transformStart = null;
        });

        // --- INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', e => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(modelGroup.children, true);
            if (hits.length > 0) transform.attach(hits[0].object);
            else if (!transform.dragging) transform.detach();
        });

        function duplicateSelected() {
            if (transform.object) {
                const clone = transform.object.clone();
                clone.position.x += 0.5;
                transform.object.parent.add(clone);
                pushAction({ type: 'add', object: clone });
                transform.attach(clone);
            }
        }

        function deleteSelected() {
            if (transform.object) {
                const obj = transform.object;
                const parent = obj.parent;
                pushAction({ type: 'remove', object: obj, parent: parent });
                transform.detach();
                parent.remove(obj);
            }
        }

        function takeScreenshot() {
            const attached = transform.object;
            transform.detach();
            renderer.render(scene, camera); 
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'model_screenshot.png';
            link.click();
            if (attached) transform.attach(attached);
        }

        // --- KEYBOARD & UI ---
        window.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') undo();
                return;
            }
            switch (e.key.toLowerCase()) {
                case 'g': transform.setMode('translate'); break;
                case 'r': transform.setMode('rotate'); break;
                case 's': transform.setMode('scale'); break;
                case 'p': takeScreenshot(); break;
                case 'escape': transform.detach(); break;
                case 'delete': case 'backspace': deleteSelected(); break;
                case 'd': duplicateSelected(); break;
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('delete-btn').addEventListener('click', deleteSelected);
        document.getElementById('duplicate-btn').addEventListener('click', duplicateSelected);
        document.getElementById('export').addEventListener('click', () => {
            transform.detach();
            new GLTFExporter().parse(modelGroup, res => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([res], { type: 'application/octet-stream' }));
                
                // Try to get a meaningful filename from the title
                const titleText = document.getElementById('model-title').innerText.replace(/\s+/g, '_').toLowerCase();
                link.download = `${titleText}.glb`; 
                link.click();
            }, e => console.error(e), { binary: true });
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
